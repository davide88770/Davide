name: Pubblica le PWA

# Ricostruisce le versioni installabili delle app dai sorgenti degli Artifact e
# le pubblica sul ramo gh-pages, da cui GitHub Pages serve il sito.
# Nessuna impostazione da toccare: Pages si e' attivato con la creazione del
# ramo, e questo workflow si limita ad aggiornarne il contenuto.
#
# La cartella pwa/ diventa la radice del sito, quindi:
#   pwa/          -> /            Ghisa & Grammi
#   pwa/viaggio/  -> /viaggio/    Alpi, Soca & Quarnero

on:
  push:
    branches:
      - claude/artifact-code-session-g1s37q
      - claude/alpi-soca-quarnero-mobile-8xceuf
      - main
    paths:
      - 'fitness/ghisa-e-grammi/app.html'
      - 'viaggi/2026-09-alpi-soca-quarnero/app-mobile.html'
      - 'pwa/**/icone/**'
      - 'tools/build-pwa.mjs'
      - 'tools/build-icone.mjs'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-pwa
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Costruisci le PWA
        run: node tools/build-pwa.mjs

      - name: Controlla che siano pagine sensate
        run: |
          for d in pwa pwa/viaggio; do
            test -s "$d/index.html"
            test -s "$d/manifest.webmanifest"
            test -s "$d/sw.js"
            grep -q 'serviceWorker' "$d/index.html"
            test -s "$d/icone/icona-192.png"
            test -s "$d/icone/icona-512.png"
            test -s "$d/icone/icona-maskable-512.png"
            echo "$d/index.html $(wc -c < "$d/index.html") byte"
          done
          grep -q 'Ghisa' pwa/index.html
          grep -q 'Quarnero' pwa/viaggio/index.html
          # Ogni service worker deve ripulire solo le proprie cache e servire
          # solo il proprio indice: sotto lo stesso dominio vivono due app.
          grep -q "startsWith('ghisa-e-grammi-')" pwa/sw.js
          grep -q "startsWith('viaggio-')" pwa/viaggio/sw.js
          grep -q 'mio(url.pathname)' pwa/sw.js
          grep -q 'mio(url.pathname)' pwa/viaggio/sw.js

      - name: Aggiorna il ramo gh-pages
        # Il sito ospita piu' app, ognuna pubblicata da un ramo diverso.
        # Questo passo SOVRAPPONE quello appena costruito al sito gia'
        # pubblicato invece di sostituirlo in blocco: cosi' un ramo non
        # cancella le app degli altri. In piu' conserva la storia del ramo e
        # non forza il push, quindi un errore resta recuperabile, e si ferma
        # se sta per far sparire qualcosa.
        run: |
          set -euo pipefail
          touch pwa/.nojekyll
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --branch gh-pages "$URL" pubblicato; then
            mkdir -p pubblicato
            git -C pubblicato init -q
            git -C pubblicato checkout -qb gh-pages
          fi
          ( ls -A pubblicato 2>/dev/null | grep -vx '.git' || true ) | sort > prima.txt
          cp -a pwa/. pubblicato/
          ( ls -A pubblicato 2>/dev/null | grep -vx '.git' || true ) | sort > dopo.txt
          echo "gia' online: $(tr '\n' ' ' < prima.txt)"
          echo "dopo:        $(tr '\n' ' ' < dopo.txt)"
          persi="$(comm -23 prima.txt dopo.txt || true)"
          if [ -n "$persi" ]; then
            echo "ERRORE: questa pubblicazione cancellerebbe: $persi"
            exit 1
          fi
          cd pubblicato
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "niente di nuovo da pubblicare"
            exit 0
          fi
          git commit -q -m "Pubblica le versioni installabili

          Sovrapposte al sito gia' pubblicato, dal commit ${GITHUB_SHA}.
          Non modificare a mano: si rigenerano a ogni push."
          git push -q "$URL" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Controlla che online ci sia davvero l'app del viaggio
        run: |
          set -euo pipefail
          test -s pubblicato/index.html
          test -s pubblicato/viaggio/index.html
          test -s pubblicato/viaggio/sw.js
          grep -q 'Quarnero' pubblicato/viaggio/index.html
          echo "online: $(ls -A pubblicato | grep -vx '.git' | tr '\n' ' ')"

      - name: Dove stanno
        run: |
          sito="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "Ghisa & Grammi: $sito/"          >> $GITHUB_STEP_SUMMARY
          echo "Alpi, Soca & Quarnero: $sito/viaggio/" >> $GITHUB_STEP_SUMMARY
