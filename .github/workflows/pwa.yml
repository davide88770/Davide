name: Pubblica la PWA

# Ricostruisce la versione installabile dell'app dal sorgente dell'Artifact e
# la pubblica sul ramo gh-pages, da cui GitHub Pages serve il sito.
# Nessuna impostazione da toccare: Pages si e' attivato con la creazione del
# ramo, e questo workflow si limita ad aggiornarne il contenuto.

on:
  push:
    branches: [claude/artifact-code-session-g1s37q, main]
    paths:
      - 'fitness/ghisa-e-grammi/app.html'
      - 'pwa/icone/**'
      - 'tools/build-pwa.mjs'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-pwa
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Costruisci la PWA
        run: node tools/build-pwa.mjs

      - name: Controlla che sia una pagina sensata
        run: |
          test -s pwa/index.html
          test -s pwa/manifest.webmanifest
          test -s pwa/sw.js
          grep -q 'Ghisa' pwa/index.html
          grep -q 'serviceWorker' pwa/index.html
          echo "index.html $(wc -c < pwa/index.html) byte"

      - name: Aggiorna il ramo gh-pages
        # Il sito ospita piu' app, ognuna pubblicata da un ramo diverso.
        # Questo passo SOVRAPPONE quello appena costruito al sito gia'
        # pubblicato invece di sostituirlo in blocco: cosi' un ramo non
        # cancella le app degli altri. In piu' conserva la storia del ramo e
        # non forza il push, quindi un errore resta recuperabile, e si ferma
        # se sta per far sparire qualcosa.
        run: |
          set -euo pipefail
          touch pwa/.nojekyll
          URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --branch gh-pages "$URL" pubblicato; then
            mkdir -p pubblicato
            git -C pubblicato init -q
            git -C pubblicato checkout -qb gh-pages
          fi
          ( ls -A pubblicato 2>/dev/null | grep -vx '.git' || true ) | sort > prima.txt

          # Il controllo sotto guarda solo i file CANCELLATI. Non bastava: un
          # ramo che ricostruisce Ghisa & Grammi dal proprio checkout vecchio
          # SOVRASCRIVE index.html con un build precedente, non lo cancella, e
          # passava liscio. E' successo davvero: l'app installata e' tornata a
          # una versione pre-v17, che non conosceva gli id delle sedute
          # registrate e sembrava aver perso tutti i carichi.
          # Qui si confronta la versione online con quella che si sta per
          # pubblicare, e non si scende mai di versione.
          ver() { grep -o "VERSIONE = { n:'v[0-9]\+'" "$1" 2>/dev/null | head -1 | grep -o '[0-9]\+' || true; }
          online="$(ver pubblicato/index.html)"; nuova="$(ver pwa/index.html)"
          echo "Ghisa & Grammi: online v${online:-?} · in pubblicazione v${nuova:-?}"
          if [ -n "$online" ] && [ -z "$nuova" ]; then
            # Il build in arrivo e' talmente vecchio da non avere nemmeno la
            # costante VERSIONE: e' il caso che ha rotto l'app installata.
            echo "ERRORE: online c'e' la v$online e questo ramo pubblicherebbe un build senza versione,"
            echo "cioe' precedente alla v17. Allinea fitness/ghisa-e-grammi/app.html su questo ramo."
            exit 1
          fi
          if [ -n "$online" ] && [ -n "$nuova" ] && [ "$online" -gt "$nuova" ]; then
            echo "ERRORE: online c'e' la v$online e questo ramo pubblicherebbe la v$nuova."
            echo "Questo ramo ha una copia vecchia di fitness/ghisa-e-grammi/app.html."
            echo "Allinealo, oppure togli la build di Ghisa & Grammi dal suo workflow."
            exit 1
          fi

          cp -a pwa/. pubblicato/
          ( ls -A pubblicato 2>/dev/null | grep -vx '.git' || true ) | sort > dopo.txt
          echo "gia' online: $(tr '\n' ' ' < prima.txt)"
          echo "dopo:        $(tr '\n' ' ' < dopo.txt)"
          persi="$(comm -23 prima.txt dopo.txt || true)"
          if [ -n "$persi" ]; then
            echo "ERRORE: questa pubblicazione cancellerebbe: $persi"
            exit 1
          fi
          cd pubblicato
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "niente di nuovo da pubblicare"
            exit 0
          fi
          git commit -q -m "Pubblica le versioni installabili

          Sovrapposte al sito gia' pubblicato, dal commit ${GITHUB_SHA}.
          Non modificare a mano: si rigenerano a ogni push."
          git push -q "$URL" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dove sta
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> $GITHUB_STEP_SUMMARY
