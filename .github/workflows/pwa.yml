name: Pubblica la PWA

# Ogni push sul ramo principale ricostruisce la versione installabile
# dell'app a partire dal sorgente dell'Artifact e la pubblica su GitHub Pages.
# Da abilitare una volta sola: Settings → Pages → Source: GitHub Actions.

on:
  push:
    # Il ramo predefinito del repo e' quello della prima sessione: Pages
    # pubblica solo da li'. 'main' e' elencato per il giorno in cui il
    # predefinito cambiera'.
    branches: [claude/artifact-code-session-g1s37q, main]
    paths:
      - 'fitness/ghisa-e-grammi/app.html'
      - 'pwa/icone/**'
      - 'tools/build-pwa.mjs'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Costruisci la PWA
        run: node tools/build-pwa.mjs
      - uses: actions/configure-pages@v5
        with:
          # attiva Pages al primo giro, senza passare dalle impostazioni
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
