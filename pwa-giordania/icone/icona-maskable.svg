<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A150F"/><stop offset=".6" stop-color="#4A2015"/><stop offset="1" stop-color="#742E1B"/>
    </linearGradient>
    <linearGradient id="roccia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FADCC0"/><stop offset=".45" stop-color="#EEAF85"/><stop offset="1" stop-color="#CB7449"/>
    </linearGradient>
    <linearGradient id="parete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0705"/><stop offset="1" stop-color="#33170F"/>
    </linearGradient>
    <linearGradient id="parete2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0D0705"/><stop offset="1" stop-color="#33170F"/>
    </linearGradient>
    <radialGradient id="luce" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#FFB878" stop-opacity=".34"/><stop offset="1" stop-color="#FFB878" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fondo)"/>
  <rect width="512" height="512" fill="url(#luce)"/>

  <!-- la facciata, scavata nella parete in fondo alla gola -->
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)" fill="url(#roccia)">
    <!-- ordine superiore: urna, tholos a tetto conico, timpano spezzato -->
    <circle cx="256" cy="64" r="13"/>
    <rect x="250" y="77" width="12" height="9"/>
    <path d="M220 120 L256 84 L292 120 Z"/>
    <rect x="212" y="120" width="88" height="12"/>
    <rect x="222" y="132" width="15" height="150"/>
    <rect x="275" y="132" width="15" height="150"/>
    <rect x="212" y="282" width="88" height="12"/>
    <path d="M126 190 L206 146 L206 160 L126 204 Z"/>
    <rect x="126" y="204" width="80" height="12"/>
    <path d="M386 190 L306 146 L306 160 L386 204 Z"/>
    <rect x="306" y="204" width="80" height="12"/>
    <rect x="134" y="216" width="20" height="66"/>
    <rect x="172" y="216" width="20" height="66"/>
    <rect x="320" y="216" width="20" height="66"/>
    <rect x="358" y="216" width="20" height="66"/>
    <rect x="118" y="294" width="276" height="16"/>
    <!-- ordine inferiore: timpano pieno e colonnato -->
    <path d="M126 362 L256 312 L386 362 Z"/>
    <rect x="112" y="362" width="288" height="18"/>
    <rect x="118" y="380" width="22" height="90"/>
    <rect x="164" y="380" width="22" height="90"/>
    <rect x="210" y="380" width="22" height="90"/>
    <rect x="282" y="380" width="22" height="90"/>
    <rect x="328" y="380" width="22" height="90"/>
    <rect x="374" y="380" width="22" height="90"/>
    <rect x="104" y="470" width="304" height="14"/>
  </g>
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)" fill="#170C07" opacity=".9">
    <rect x="232" y="398" width="48" height="72"/>
  </g>

  <!-- le pareti del Siq: la gola che si apre e la incornicia -->
  <path d="M0 0 L96 0 L84 118 L106 236 L78 356 L96 470 L0 512 Z" fill="url(#parete)"/>
  <path d="M512 0 L416 0 L428 130 L404 248 L432 368 L414 470 L512 512 Z" fill="url(#parete2)"/>
  <g fill="#FFFFFF" opacity=".055">
    <path d="M0 132 L92 122 L92 132 L0 144 Z"/><path d="M0 268 L96 258 L96 266 L0 278 Z"/>
    <path d="M0 392 L86 382 L86 392 L0 404 Z"/>
    <path d="M512 158 L422 148 L422 158 L512 170 Z"/><path d="M512 300 L414 290 L414 298 L512 310 Z"/>
    <path d="M512 416 L424 406 L424 416 L512 428 Z"/>
  </g>
</svg>
