<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Vietnam 2026 — la giunca della baia di Ha Long fra i faraglioni.
       Regole che valgono per un'icona da schermata home: poche masse, grandi,
       e la silhouette deve reggere a 48 px, dove il dettaglio sparisce. Quindi
       niente luna, niente onde, niente montagnine di sfondo.
       I faraglioni hanno i fianchi quasi verticali e la cima arrotondata, e
       stanno in gruppo: è quello che distingue la baia da una catena alpina.
       Lo scafo è legno scuro e non un blocco bianco, così l'unico bianco
       dell'icona resta l'albero e le vele ambra portano tutto il peso. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D444D"/><stop offset="1" stop-color="#0A1D22"/>
    </linearGradient>
    <linearGradient id="vela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C16C"/><stop offset="1" stop-color="#D99C40"/>
    </linearGradient>
    <filter id="ombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#cielo)"/>

  <!-- il gruppo di faraglioni dietro -->
  <g fill="#1B4A53">
    <path d="M70 384 L86 268 Q96 228 118 234 Q138 240 142 282 L158 384 Z"/>
    <path d="M296 384 L310 246 Q322 202 346 209 Q368 216 372 266 L386 384 Z"/>
    <path d="M454 384 L464 280 Q472 242 492 248 Q510 254 512 296 L512 384 Z"/>
  </g>

  <!-- i due davanti, più alti e più chiari -->
  <g fill="#2D6773">
    <path d="M6 384 L26 214 Q40 158 76 168 Q108 177 113 240 L134 384 Z"/>
    <path d="M384 384 L404 186 Q420 126 458 136 Q492 146 497 224 L512 384 Z"/>
  </g>

  <!-- l'acqua -->
  <rect x="0" y="384" width="512" height="128" fill="#07181D"/>
  <rect x="0" y="384" width="512" height="3" fill="#2D6773" opacity=".55"/>

  <!-- la giunca -->
  <g filter="url(#ombra)">
    <path d="M262 104 L262 390" stroke="#F2F6F3" stroke-width="9" stroke-linecap="round"/>

    <!-- vela maestra, a stecche -->
    <path d="M262 114 L262 378 L126 378 Q136 220 262 114 Z" fill="url(#vela)"/>
    <path d="M262 114 L262 378 L126 378 Q136 220 262 114 Z" fill="none"
          stroke="#8A5008" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#8A5008" stroke-width="5" stroke-linecap="round" opacity=".9">
      <path d="M262 174 L211 174M262 228 L172 228M262 282 L144 282M262 334 L129 334"/>
    </g>

    <!-- mezzana -->
    <path d="M276 378 L276 198 Q356 262 404 362 Z" fill="#CB9038"/>
    <path d="M276 378 L276 198 Q356 262 404 362 Z" fill="none"
          stroke="#8A5008" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#8A5008" stroke-width="5" stroke-linecap="round" opacity=".9">
      <path d="M276 282 L324 282M276 334 L364 334"/>
    </g>

    <!-- scafo di legno, con la falchetta chiara -->
    <path d="M132 380 L398 380 L360 428 L170 428 Z" fill="#5E3A12"/>
    <path d="M132 380 L398 380 L392 392 L138 392 Z" fill="#E8D9BC"/>
  </g>
</svg>
