<title>Ghisa &amp; Grammi</title>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   GHISA & GRAMMI — token di progetto
   Identità: "gesso e acciaio". Fondo grafite/carta fredda, inchiostro
   magnesite, nessun accento decorativo: il colore è riservato al significato
   (stato, macronutrienti, colori reali dei dischi olimpici).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --bg:#EAEDEC; --surface:#FFFFFF; --surface-2:#F4F7F6; --sunk:#E1E6E4; --raise:#FFFFFF;
  --ink:#0F1518; --ink-2:#525D5C; --ink-3:#7A8583; --ink-4:#9BA5A3;
  --line:#DBE1DF; --line-2:#C2CBC8;
  --solid:#0F1518; --on-solid:#F4F7F6;
  --accent:#2a78d6; --accent-text:#1B589F; --accent-soft:#E4EEFA;
  --good:#0ca30c; --good-text:#0A7A0A; --good-soft:#E2F4E2;
  --warn:#fab219; --warn-text:#8A6100; --warn-soft:#FBF0D8;
  --crit:#d03b3b; --crit-text:#B32B2B; --crit-soft:#FAE3E3;
  --m-pro:#2a78d6; --m-cho:#eb6834; --m-fat:#1baf7a;
  --grid:#E6EBE9; --axis:#C2CBC8;
  --shadow-1:0 1px 2px rgba(15,21,24,.06);
  --shadow-2:0 1px 2px rgba(15,21,24,.05),0 10px 26px -14px rgba(15,21,24,.28);
  --shadow-3:0 -1px 0 var(--line),0 -12px 34px -18px rgba(15,21,24,.3);
  --display:Bahnschrift,"DIN Alternate","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:"SF Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-s:9px; --r-l:16px;
  --tab-h:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0F12; --surface:#151A1D; --surface-2:#1C2327; --sunk:#101619; --raise:#1F272B;
    --ink:#ECF0F1; --ink-2:#9EA9AD; --ink-3:#778286; --ink-4:#5C666A;
    --line:#232B30; --line-2:#333D43;
    --solid:#ECF0F1; --on-solid:#0B0F12;
    --accent:#3987e5; --accent-text:#77B0F0; --accent-soft:#14283D;
    --good:#0ca30c; --good-text:#4FC44F; --good-soft:#0F2A12;
    --warn:#fab219; --warn-text:#E0A82C; --warn-soft:#2E2410;
    --crit:#d03b3b; --crit-text:#E86B6B; --crit-soft:#2E1516;
    --m-pro:#3987e5; --m-cho:#d95926; --m-fat:#199e70;
    --grid:#1E262A; --axis:#333D43;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 1px 2px rgba(0,0,0,.5),0 12px 30px -16px rgba(0,0,0,.85);
    --shadow-3:0 -1px 0 var(--line),0 -14px 38px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0F12; --surface:#151A1D; --surface-2:#1C2327; --sunk:#101619; --raise:#1F272B;
  --ink:#ECF0F1; --ink-2:#9EA9AD; --ink-3:#778286; --ink-4:#5C666A;
  --line:#232B30; --line-2:#333D43;
  --solid:#ECF0F1; --on-solid:#0B0F12;
  --accent:#3987e5; --accent-text:#77B0F0; --accent-soft:#14283D;
  --good:#0ca30c; --good-text:#4FC44F; --good-soft:#0F2A12;
  --warn:#fab219; --warn-text:#E0A82C; --warn-soft:#2E2410;
  --crit:#d03b3b; --crit-text:#E86B6B; --crit-soft:#2E1516;
  --m-pro:#3987e5; --m-cho:#d95926; --m-fat:#199e70;
  --grid:#1E262A; --axis:#333D43;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 1px 2px rgba(0,0,0,.5),0 12px 30px -16px rgba(0,0,0,.85);
  --shadow-3:0 -1px 0 var(--line),0 -14px 38px -20px rgba(0,0,0,.9);
}

/* colori reali dei dischi olimpici: non sono tema, sono oggetti */
:root{
  --p25:#D42B21; --p20:#1D4FA3; --p15:#E5B520; --p10:#1E8A45;
  --p5:#E4E7E3;  --p2:#C0342A;  --p1:#B9C0C4;  --p05:#8E979B;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ── scheletro applicazione ─────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar .in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1180px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.topttl{
  position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;
  opacity:0;transform:translateY(7px);transition:opacity .2s ease,transform .2s ease;pointer-events:none;
  padding:0 96px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar.raccolta .topttl{opacity:1;transform:none}
.topbar.raccolta .brand{opacity:0;pointer-events:none;transition:opacity .18s ease}
.topbar .in{position:relative}
@media (min-width:900px){.topttl{display:none}.topbar.raccolta .brand{opacity:1}}
.brand{transition:opacity .18s ease}
.brand span{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-family:var(--display)}
.iconbtn{
  width:38px;height:38px;display:grid;place-items:center;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:0 0 auto;
}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.iconbtn svg{width:19px;height:19px;display:block}

main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:18px 16px calc(var(--tab-h) + 26px + env(safe-area-inset-bottom))}
.view{display:flex;flex-direction:column;gap:16px;animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ── barra di navigazione: in basso su telefono, a lato su schermo largo ── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  box-shadow:var(--shadow-3);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:var(--tab-h);color:var(--ink-3);position:relative;
}
.tab svg{width:22px;height:22px;display:block}
.tab span{font-family:var(--display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tab{-webkit-tap-highlight-color:transparent;transition:color .15s ease,transform .1s ease}
.tab:active{transform:scale(.94)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--ink);
}
.tab .dot{position:absolute;top:9px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

@media (min-width:900px){
  .app{flex-direction:row}
  .tabs{
    position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;height:100dvh;
    grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:4px;
    width:214px;flex:0 0 214px;padding:14px 12px;border-right:1px solid var(--line);
    box-shadow:none;background:var(--surface);
  }
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;border-radius:10px}
  .tab span{font-size:12.5px;letter-spacing:.08em}
  .tab[aria-selected="true"]{background:var(--sunk)}
  .tab[aria-selected="true"]::before{top:50%;left:0;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0}
  .tab .dot{position:static;margin-left:auto;border-color:var(--surface)}
  .col{display:flex;flex-direction:column;min-width:0;flex:1}
  main{padding-bottom:40px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
}
@media (max-width:899px){ .col{display:contents} }

/* ── mattoni ───────────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card.pad{padding:16px}
.card.flat{box-shadow:none}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.hd h2,.hd h3{margin:0;font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.hd h2{font-size:15px}
.hd h3{font-size:13.5px;color:var(--ink-2)}
.hd .sp{margin-left:auto}
.bd{padding:16px}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
h1.big{font-family:var(--display);font-size:clamp(27px,6vw,36px);line-height:1.02;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em}
.row{display:flex;align-items:center;gap:10px}
.wrapf{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.sep{height:1px;background:var(--line);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:var(--display);font-size:14px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  transition:transform .08s ease,background .15s ease;
}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--surface-2)}
.btn.solid{background:var(--solid);color:var(--on-solid);border-color:transparent}
.btn.solid:hover{background:color-mix(in srgb,var(--solid) 88%,var(--bg))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12.5px}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.42;pointer-events:none}

.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  background:var(--sunk);color:var(--ink-2);border:1px solid transparent;white-space:nowrap;
}
.chip.acc{background:var(--accent-soft);color:var(--accent-text)}
.chip.good{background:var(--good-soft);color:var(--good-text)}
.chip.warn{background:var(--warn-soft);color:var(--warn-text)}
.chip.crit{background:var(--crit-soft);color:var(--crit-text)}
.chip.line{background:transparent;border-color:var(--line-2);color:var(--ink-3)}
.chip svg{width:13px;height:13px}

input[type="text"],input[type="number"],input[type="date"],input[type="time"],select,textarea{
  width:100%;min-height:44px;padding:9px 11px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-size:16px; /* iOS: sotto i 16px Safari zooma al focus */
}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
label.fld>span{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fldrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  padding:7px 13px;border-radius:8px;white-space:nowrap;color:var(--ink-2);
  font-family:var(--display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}

.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}
.empty p{margin:0 0 14px;max-width:38ch;margin-inline:auto}

/* ── OGGI ───────────────────────────────────────────────────────────────── */
.hero{display:flex;flex-direction:column;gap:3px;padding:2px 2px 6px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:11px 13px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:25px;line-height:1.12;font-variant-numeric:tabular-nums}
.stat b small{font-size:13px;color:var(--ink-3);font-weight:400;margin-left:2px}
.stats.q4{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.stats.q4{grid-template-columns:repeat(4,1fr)}}
.stat span{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigcta{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px;border-radius:var(--r);border:1px solid transparent;
  background:var(--solid);color:var(--on-solid);box-shadow:var(--shadow-2);
}
.bigcta:active{transform:scale(.995)}
.bigcta .t{flex:1;min-width:0}
.bigcta .t b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.bigcta .t span{display:block;font-size:13px;opacity:.72;margin-top:2px}
.bigcta .go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-solid) 16%,transparent);flex:0 0 auto}
.bigcta .go svg{width:19px;height:19px}

/* ── ALLENAMENTO ────────────────────────────────────────────────────────── */
.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);overflow:hidden}
.exc.done{border-color:color-mix(in srgb,var(--good) 42%,var(--line))}
.exc>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:11px}
.exc>summary::-webkit-details-marker{display:none}
.exc>summary:hover{background:var(--surface-2)}
.exc .idx{
  width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  background:var(--sunk);color:var(--ink-2);font-family:var(--display);font-size:14px;font-weight:700;
}
.exc.done .idx{background:var(--good-soft);color:var(--good-text)}
.exc .nm{flex:1;min-width:0}
.exc .nm b{display:block;font-size:15.5px;line-height:1.25;font-weight:600}
.exc .nm span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.exc .prog{font-family:var(--display);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right;line-height:1.25}
.exc .ultkg{display:block;font-size:12px;color:var(--accent-text)}
.exc .caret{width:16px;height:16px;color:var(--ink-4);transition:transform .18s ease;flex:0 0 auto}
.exc[open] .caret{transform:rotate(180deg)}
.exc .body{padding:0 14px 14px;border-top:1px solid var(--line)}

.sethead,.setrow{
  display:grid;grid-template-columns:30px 1fr 1fr 58px 44px;gap:7px;align-items:center;
}
.sethead{padding:11px 0 6px;font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)}
.sethead>*{text-align:center}
.sethead>*:first-child{text-align:left}
.setrow{padding:3px 0}
.setrow .sn{
  font-family:var(--display);font-size:14px;color:var(--ink-3);text-align:center;
  font-variant-numeric:tabular-nums;
}
.setrow input{min-height:42px;text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:16px}
.setrow.ok input{background:var(--good-soft);border-color:transparent;color:var(--good-text)}
.setrow .tick{
  transition:transform .1s ease,background .15s ease;
  width:42px;height:42px;border-radius:10px;border:1px solid var(--line-2);
  display:grid;place-items:center;color:var(--ink-4);background:var(--surface);
}
.setrow .tick svg{width:19px;height:19px}
.setrow .tick:active{transform:scale(.9)}
.setrow.ok .tick{background:var(--good);border-color:transparent;color:#fff}
.setrow .rir{font-size:15px}
.hint{font-size:12.5px;color:var(--ink-3);padding:2px 0 0;text-align:center;grid-column:1/-1}
.lastnote{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:9px 11px;border-radius:var(--r-s);background:var(--sunk);margin:11px 0 3px;font-size:13px;color:var(--ink-2);
}
.lastnote b{font-family:var(--display);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sug{border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent-text);padding:9px 12px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:13.5px;margin:10px 0 0}
.sug b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:12px;display:block}
.ssgroup{border:1px dashed var(--line-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;position:relative;background:var(--surface-2)}
.ssgroup>.lbl{font-family:var(--display);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px}

/* bilanciere: caricamento per lato, colori reali dei dischi */
.bar{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 11px;background:var(--sunk);border-radius:var(--r-s);overflow-x:auto}
.bar .lbl{font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);flex:0 0 auto}
.bar .plates{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.bar .sleeve{width:22px;height:7px;border-radius:2px;background:var(--p1);flex:0 0 auto}
.bar .pl{width:11px;border-radius:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.22)}
.bar .none{font-size:12.5px;color:var(--ink-3)}

/* ── DIETA ──────────────────────────────────────────────────────────────── */
.rings{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.rings svg{width:118px;height:118px;display:block}
.macros{display:flex;flex-direction:column;gap:9px;min-width:0}
.macro{display:grid;grid-template-columns:9px 1fr auto;gap:9px;align-items:center}
.macro i{width:9px;height:9px;border-radius:2.5px;display:block}
.macro .nm{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.macro .vl{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.macro .vl s{text-decoration:none;color:var(--ink-3)}
.meal{border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:11px}
.meal>summary::-webkit-details-marker{display:none}
.meal .time{font-family:var(--display);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;width:42px;flex:0 0 auto}
.meal .nm{flex:1;min-width:0;font-weight:600;font-size:15px}
.meal .kc{font-family:var(--display);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item{display:flex;align-items:flex-start;gap:11px;padding:9px 14px 9px 14px;border-top:1px solid var(--line)}
.item:hover{background:var(--surface-2)}
.item .cb{
  width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;background:var(--surface);margin-top:1px;
}
.item .cb svg{width:16px;height:16px}
.item.on .cb{background:var(--good);border-color:transparent;color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{font-weight:500;font-size:14.5px;display:block;line-height:1.35}
.item.on .tx b{color:var(--ink-3);text-decoration:line-through}
.item .tx span{font-size:12.5px;color:var(--ink-3);display:block}
.item .sw{
  font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-text);padding:3px 7px;border-radius:6px;background:var(--accent-soft);flex:0 0 auto;
}
.cibi{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cibo{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);text-align:left;width:100%;min-height:44px}
.cibo{-webkit-tap-highlight-color:transparent;transition:background .12s ease}
.cibo:active{background:var(--sunk)}
.cibo:hover{background:var(--surface-2)}
.cibo .q{font-family:var(--display);font-size:15.5px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);white-space:nowrap}
.cibo .w{font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin-left:5px}
.cibo .nm2{font-size:14.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.cibo .sw2{font-family:var(--display);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}
.cibo:hover .sw2,.cibo.mod .sw2{color:var(--accent-text)}
.cibo.mod .nm2{color:var(--accent-text)}
.subwrap>summary{list-style:none;cursor:pointer;padding:2px 14px 11px 51px;font-family:var(--display);
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.subwrap>summary::-webkit-details-marker{display:none}
.subwrap>summary:hover{color:var(--accent-text)}
.subwrap[open]>summary{color:var(--accent-text)}
.subs{padding:0 14px 12px 51px;display:flex;flex-direction:column;gap:6px}
.sub{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface-2);text-align:left;width:100%;
}
.sub:hover{border-color:var(--accent);background:var(--accent-soft)}
.sub b{font-weight:500;font-size:14px;flex:1}
.sub span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.extra{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.extra .tx{flex:1;min-width:0}

/* ── PROGRESSI ──────────────────────────────────────────────────────────── */
.chart{width:100%;display:block;overflow:visible}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart text{font-family:var(--display);font-size:11.5px;fill:var(--ink-3);letter-spacing:.05em}
.chart text.val{fill:var(--ink);font-size:12.5px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.10}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .brm{fill:var(--accent)}
.chart .brm.dim{fill:var(--ink-4);opacity:.45}
.chart .trend{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .hit{fill:transparent;cursor:pointer}
.chartwrap{position:relative}
.tip{
  position:absolute;pointer-events:none;z-index:5;opacity:0;transform:translate(-50%,-115%);
  background:var(--solid);color:var(--on-solid);padding:6px 9px;border-radius:8px;
  font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:var(--shadow-2);transition:opacity .12s ease;
}
.tip b{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.tip.on{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0 0;font-size:12.5px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.vcmp{display:grid;grid-template-columns:1fr 32px 16px 32px 30px 32px;gap:6px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.vcmp:last-of-type{border-bottom:0}
.vcmp .g{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcmp .da,.vcmp .a,.vcmp .dd,.vcmp .ff{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.vcmp .ar{text-align:center;color:var(--ink-4);font-size:13px}
.vcmp .dd,.vcmp .ff{font-size:12.5px}
.vcmp .ff{color:var(--ink-3)}
.vcmp.head{border-bottom:1px solid var(--line-2);padding-bottom:5px}
.vcmp.head span{font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.cmp4{display:grid;grid-template-columns:1fr 44px 44px 40px;gap:6px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.cmp4:last-of-type{border-bottom:0}
.cmp4 .g{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp4 b,.cmp4 .w{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right;font-size:15px;font-weight:500}
.cmp4 .w{font-size:12.5px;color:var(--ink-3);text-align:center}
.cmp4.head{border-bottom:1px solid var(--line-2);padding-bottom:5px}
.cmp4.head span{font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.cmp4.head span.g{text-align:left}
.cmp4.head span.w{text-align:center}
.vbar{display:grid;grid-template-columns:76px 1fr 76px;gap:10px;align-items:center;padding:5px 0}
.vbar .g{font-family:var(--display);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .tr{height:12px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.vbar .fl{height:100%;border-radius:3px;background:var(--accent);min-width:2px}
.vbar .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3);opacity:.65}
.vbar .n{font-family:var(--display);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:normal}
.tbl th{font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.tbl td.n{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:14px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pr{display:inline-flex;align-items:center;gap:4px;color:var(--warn-text);font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.pr svg{width:12px;height:12px}

/* ── PIANO (editor) ─────────────────────────────────────────────────────── */
.ed{display:flex;flex-direction:column;gap:9px}
.edrow{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s)}
.edrow .tx{flex:1;min-width:0}
.edrow .tx b{display:block;font-size:14.5px;font-weight:600}
.edrow .tx span{display:block;font-size:12.5px;color:var(--ink-3)}
.edrow .hnd{color:var(--ink-4);flex:0 0 auto}
.edrow .hnd svg{width:16px;height:16px;display:block}
.mini{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);border:1px solid transparent;flex:0 0 auto}
.mini:hover{background:var(--sunk);color:var(--ink)}
.mini.dg:hover{background:var(--crit-soft);color:var(--crit-text)}
.mini svg{width:16px;height:16px}

/* ── foglio modale ──────────────────────────────────────────────────────── */
.sheet{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,12,14,.5);backdrop-filter:blur(3px);padding:0;
}
.sheet .pane{
  background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--shadow-2);
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
  animation:up .24s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){
  .sheet{align-items:center;padding:20px}
  .sheet .pane{border-radius:var(--r-l);max-height:82vh}
}
.sheet .hd{position:sticky;top:0;background:var(--surface);z-index:2}

/* cronometro di recupero */
.timerbar{
  position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:45;
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--solid);color:var(--on-solid);box-shadow:var(--shadow-2);
}
.timerbar .t{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:66px}
.timerbar .lb{flex:1;min-width:0;font-size:12.5px;opacity:.75;line-height:1.25}
.timerbar button{color:var(--on-solid);border-color:color-mix(in srgb,var(--on-solid) 30%,transparent);background:transparent}
.timerbar .ring{width:34px;height:34px;flex:0 0 auto}
.timerbar .ring circle{fill:none;stroke-width:3.5}
.timerbar .ring .bgc{stroke:color-mix(in srgb,var(--on-solid) 22%,transparent)}
.timerbar .ring .fgc{stroke:var(--on-solid);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
@media (min-width:900px){ .timerbar{left:214px;bottom:0} }

.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:80;
  bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));
  background:var(--solid);color:var(--on-solid);padding:11px 17px;border-radius:999px;
  font-size:14px;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,-6px)}
@media (min-width:900px){ .toast{bottom:26px} }

.backup{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--warn-text);font-size:13.5px}
.backup.ok{background:var(--good-soft);color:var(--good-text)}
.backup svg{width:18px;height:18px;flex:0 0 auto}

/* ── stampa: la scheda va in palestra su carta ──────────────────────────── */
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#fff;--sunk:#fff;--ink:#000;--ink-2:#333;--ink-3:#555;--line:#bbb;--line-2:#888;--shadow-1:none;--shadow-2:none}
  .tabs,.topbar,.timerbar,.toast,.sheet,.noprint,.bigcta,.iconbtn{display:none !important}
  body{background:#fff;font-size:10.5pt}
  main{padding:0;max-width:none}
  .app{display:block}
  .card,.exc{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  .exc>.body{display:block !important}
  .exc>summary{padding:10px 12px 6px}
  .exc .caret,.exc .prog{display:none}
  .exc .sug,.exc .lastnote,.exc .bar{display:none}
  .setrow .tick{display:none}
  .sethead,.setrow{grid-template-columns:26px 1fr 1fr 46px}
  .setrow input{min-height:26px}
  .setrow input{border:1px solid #999;background:#fff}
  .view{animation:none}
  .printonly{display:block !important}
  h1.big{font-size:20pt}

  @page{size:A4;margin:14mm 12mm}
}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   DATI — trascritti da "Piano Master FINAL" (38 pp.) e "Piano Alimentare
   Master" (29 pp.). Ogni numero qui sotto viene dai due documenti; dove i
   documenti si contraddicono la regola applicata è annotata con [SCELTA].
   ═══════════════════════════════════════════════════════════════════════════ */

const GRUPPI = {
  petto:'Petto', dorso:'Dorso', trapezi:'Trapezi', spalle:'Spalle', bicipiti:'Bicipiti', tricipiti:'Tricipiti',
  quad:'Quadricipiti', femorali:'Femorali', gluteo:'Gluteo', polpacci:'Polpacci', core:'Core'
};
/* Volume settimanale — SOLO i gruppi per cui il piano dichiara un target.
   Il piano ne dà due letture: la colonna TARGET (pag. 24) e il range più
   stretto per i punti deboli (pag. 20). Sono riportate entrambe, insieme alle
   serie attese su 4 e su 5 giorni di allenamento. Per petto, dorso, polpacci e
   core il piano non fissa un target: si mostra il conteggio e basta. */
const VOL_TARGET = {
  bicipiti:[10,20], tricipiti:[10,20], quad:[10,20], femorali:[10,20],
  gluteo:[10,16], spalle:[12,20],
  /* Il piano non dichiara un target per questi: valori comunemente accettati,
     segnalati come tali dove compaiono. */
  petto:[10,20], dorso:[10,20], polpacci:[6,12]
};
/* Gruppi che ricevono molto lavoro indiretto: il conteggio delle serie dirette
   li sottostima, e non vanno segnalati come sotto-dosati. */
const INDIRETTO = {
  tricipiti:'panca, military e dip', bicipiti:'trazioni e rematore',
  gluteo:'hack squat, pressa e stacco romeno', polpacci:'ogni compound in piedi'
};
/* Serie dirette e indirette. Pelland e colleghi (Sports Medicine, 2025) hanno
   mostrato che separare le serie dirette da quelle indirette e' necessario per
   prevedere gli adattamenti: una panca non e' una serie di tricipite, ma non e'
   nemmeno zero. La convenzione usata qui e' la loro: la serie indiretta pesa
   mezza serie ("frazionale"). Le voci coprono tutti gli esercizi del piano; un
   esercizio scritto a mano nella sostituzione non ha secondari e conta solo
   diretto. */
const SECONDARI = [
  [/^Panca /,            ['tricipiti','spalle']],
  [/^Dip /,              ['petto','spalle']],
  [/^Military press/,    ['tricipiti']],
  [/^(Trazioni|Lat machine|Rematore|Pulley basso)/, ['bicipiti']],
  [/^Hack squat/,        ['gluteo']],
  [/^Pressa/,            ['gluteo']],
  [/^Romanian deadlift/, ['gluteo']],
  [/^Hip thrust/,        ['femorali']],
  [/^Stacco a gambe tese/, ['gluteo']]
];
const secDi = n => { for(const [r,g] of SECONDARI) if(r.test(n)) return g; return []; };
/* Oltre questa soglia, nella stessa seduta, le serie in piu' sullo stesso
   muscolo non mostrano piu' un vantaggio rilevabile ("Is There Too Much of a
   Good Thing?", meta-regressione sul volume per seduta, 2025). Contate in
   serie frazionali. */
const SERIE_SEDUTA_MAX = 11;
/* La banda 10-20 viene da studi in cui le serie finivano spesso a 2-4
   ripetizioni dal cedimento. Portandole a cedimento — che e' la scelta di
   questo piano sull'isolamento — servono meno serie per lo stesso stimolo
   (Robinson e colleghi, 2024: l'ipertrofia cresce avvicinandosi al cedimento).
   Sotto le 6 serie frazionali pero' non ci sta nessun modello: quello e' il
   limite che l'app segnala in rosso. */
const VOL_MIN = 6;
/* Volume settimanale in serie DIRETTE fissato da Davide. E' il riferimento
   contro cui l'app controlla le schede: se una scheda non ci arriva o lo
   supera, lo dice. */
const VOL_OBIETTIVO = {

/* Per allenamento nel pomeriggio o di sera le fonti di carboidrati del pranzo
   e della cena si scambiano: il pasto dopo l'allenamento deve essere quello
   carico. Il risolutore ribilancia comunque la giornata sul target. */
function spostaCarbo(lista){
  const carbo = m => m.i.reduce((a,[k,g]) => a + (ALIMENTI[k].r === 'c' ? ALIMENTI[k].c*g : 0), 0);
  const ultimo = lista.length - 1;
  let iMax = -1, top = 0;
  lista.forEach((m,i) => { if(i < ultimo && carbo(m) > top){ top = carbo(m); iMax = i; } });
  if(iMax < 0 || top === 0) return lista;
  const soloC = m => m.i.filter(([k]) => ALIMENTI[k].r === 'c');
  const senzaC = m => m.i.filter(([k]) => ALIMENTI[k].r !== 'c');
  const A = lista[iMax], B = lista[ultimo];
  return lista.map((m,i) => i === iMax ? Object.assign({}, m, { i:senzaC(A).concat(soloC(B)) })
    : (i === ultimo ? Object.assign({}, m, { i:senzaC(B).concat(soloC(A)) }) : m));
}

  for(const sid of [...new Set(Object.values(giorni))]){
    const visti = new Set();
    for(const ex of SESS[sid].ex){
      const n = serieDi(ex, tipo);
      per[ex.g] = (per[ex.g]||0) + n; tot += n; visti.add(ex.g);
      fr[ex.g] = (fr[ex.g]||0) + n;
      for(const g of secDi(ex.n)) if(g !== ex.g) fr[g] = (fr[g]||0) + n/2;
    }
    for(const g of visti) freq[g] = (freq[g]||0) + 1;
  }
  return { per, freq, fr, tot };
}
/* Serie frazionali per gruppo dentro una singola seduta, per il controllo
   sulla soglia per seduta. */
function fraseduta(sid, tipo='base'){
  const w = {};
  for(const ex of SESS[sid].ex){
    const n = serieDi(ex, tipo);
    w[ex.g] = (w[ex.g]||0) + n;
    for(const g of secDi(ex.n)) if(g !== ex.g) w[g] = (w[g]||0) + n/2;
  }
  return w;
}
/* Sedute in cui un gruppo supera la soglia utile per seduta. */
function sopraSoglia(giorni, tipo='base'){
  const out = [];
  for(const sid of [...new Set(Object.values(giorni))]){
    const w = fraseduta(sid, tipo);
    for(const [g,v] of Object.entries(w)) if(v > SERIE_SEDUTA_MAX) out.push({ sid, g, v });
  }
  return out;
}
function tipoSettDi(d){
  const f = faseDi(d);
  const t = (S.sess[d] && S.sess[d].tipo) || S.ui.sett;
  return f.settimane.includes(t) ? t : f.settimane[0];
}
/* Serie effettive: tabella del piano dove esiste, altrimenti la regola generale
   del deload ("stesso carico · −40% serie"). */
function serieDi(ex, tipo){
  if(ex.sv && ex.sv[tipo] != null) return ex.sv[tipo];
  if(tipo === 'deload') return Math.max(1, Math.round(ex.s * 0.6));
  return ex.s;
}
const repDi = (ex,f) => (f.recomp && ex.repRecomp) ? ex.repRecomp : ex.r;
const isWM  = (ex,tipo) => !!(ex.wm && tipo === 'peak');

/* ── log ────────────────────────────────────────────────────────────────── */
function log(d){
  if(!S.sess[d]){
    const f = faseDi(d), s = sessioneDi(d,f);
    S.sess[d] = { sid: s ? s.id : null, tipo: tipoSettDi(d), set:{}, piu:{}, sost:{}, nota:'', mod:Date.now() };
  }
  const L = S.sess[d];
  if(!L.set)  L.set  = {};
  if(!L.piu)  L.piu  = {};
  if(!L.sost) L.sost = {};
  return L;
}
function serieLog(d, i, n){
  const L = log(d);
  if(!L.piu) L.piu = {};
  n += (L.piu[i] || 0);
  if(!L.set[i]) L.set[i] = [];
  while(L.set[i].length < n) L.set[i].push({ kg:'', rep:'', ok:false });
  /* Riducendo il tipo di settimana non si buttano righe che hanno dei dati. */
  if(L.set[i].length > n) L.set[i] = L.set[i].slice(0, Math.max(n, L.set[i].filter(serieValida).length));
  return L.set[i];
}
/* Una serie conta come fatta se l'hai confermata col tasto OPPURE se hai
   scritto carico e ripetizioni. Prima contavano solo le confermate, e chi
   compilava i campi senza toccare la spunta non si ritrovava piu' niente:
   nessuno storico, nessun "ultima volta", nessun suggerimento. Il tasto serve
   a far partire il recupero e a segnare l'avanzamento, non a salvare. */
const serieValida = r => !!r && (r.ok || (+r.kg > 0 && +r.rep > 0));

/* ── testi riscritti da te ───────────────────────────────────────────────
   Nome, tecnica e nota di ogni esercizio si possono riscrivere. La chiave e'
   SEMPRE il nome originale del piano, mai quello nuovo: cosi' rinominare un
   esercizio non stacca i carichi che ci hai gia' registrato sotto, e se un
   giorno ripristini l'originale ritrovi tutto. Per lo stesso motivo ex.n resta
   il nome del piano e il nome tuo viaggia in ex.nv, che serve solo a mostrarlo. */
const testoDi = n => (S.testi || {})[n] || null;
const nomeDi  = n => { const t = testoDi(n); return (t && t.n) ? t.n : n; };
function conTesti(base){
  const t = testoDi(base.n);
  if(!t) return base;
  return Object.assign({}, base, {
    nv:   t.n    || base.n,
    cue:  t.cue  !== undefined ? t.cue  : base.cue,
    note: t.nota !== undefined ? t.nota : base.note,
    mio: 1
  });
}
/* L'esercizio che vale per quella giornata: quello del piano, oppure quello
   che hai scritto tu al suo posto. La sostituzione vale solo per quel giorno. */
function exDi(sess, i, d){
  const ov = ((S.sess[d]||{}).sost||{})[i];
  const base = sess.ex[i];
  if(!base) return base;
  if(!ov) return conTesti(base);
  return Object.assign({}, base, {
    n: ov.n || base.n,
    g: ov.g || base.g,
    r: ov.r || base.r,
    s: ov.s || base.s,
    sv: ov.s ? null : base.sv,
    cue: ov.n ? '' : base.cue,
    note: ov.n ? 'Esercizio messo da te al posto di “' + base.n + '” per questa giornata.' : base.note,
    sost: ov.n ? 1 : 0
  });
}

/* Storico di un esercizio per nome: attraversa fasi e sessioni diverse. */
function storico(nome){
  const out = [];
  for(const [d,L] of Object.entries(S.sess)){
    const s = SESS[L.sid]; if(!s) continue;
    s.ex.forEach((_,i) => {
      const ex = exDi(s, i, d);
      if(ex.n !== nome) return;
      const righe = (L.set[i]||[]).filter(r => serieValida(r) && +r.kg > 0 && +r.rep > 0);
      if(righe.length) out.push({ d, righe });
    });
  }
  return out.sort((a,b) => a.d < b.d ? -1 : 1);
}
const epley = (kg,rep) => +kg * (1 + (+rep)/30);
function miglioreDi(nome){
  let rm = 0, kg = 0, quando = null;
  for(const g of storico(nome)) for(const r of g.righe){
    const v = epley(r.kg, r.rep);
    if(v > rm){ rm = v; quando = g.d; }
    if(+r.kg > kg) kg = +r.kg;
  }
  return { rm, kg, quando };
}
function ultimaVolta(nome, escludi){
  const h = storico(nome).filter(g => g.d !== escludi);
  return h.length ? h[h.length-1] : null;
}
/* Incremento da proporre quando si conquista il top del range.
   Il piano dice +2,5 kg, ed e' anche il salto minimo che esiste davvero in
   palestra: 1,25 kg per lato sul bilanciere, un piastrino sullo stack, il
   manubrio successivo. L'idea di proporre +1,25 sull'isolamento era sbagliata:
   non e' un peso che puoi mettere. Sull'isolamento la granularita' la danno le
   ripetizioni, non il carico — ed e' esattamente il senso della doppia
   progressione. Un esercizio puo' dichiarare il proprio con inc. */
const incrementoDi = (ex, nome) => (ex && ex.inc) ? ex.inc : 2.5;

/* Suggerimento carico — doppia progressione del piano:
   "top del range → +2,5 kg la settimana dopo". */
function suggerimento(ex, nome, dOggi){
  const u = ultimaVolta(nome, dOggi);
  if(!u) return null;
  const top = (String(ex.r).match(/(\d+)\s*$/) || [])[1];
  const kgs = u.righe.map(r => +r.kg), reps = u.righe.map(r => +r.rep);
  const kgMax = Math.max(...kgs);
  if(!top || ex.tempo) return { kg:kgMax, testo:`Ultima volta ${nf(kgMax,1)} kg. Stesso carico, punta al top del range.` };
  const lavorate = u.righe.filter(r => +r.kg === kgMax);
  const tutteAlTop = lavorate.length >= 2 && lavorate.every(r => +r.rep >= +top);
  const inc = incrementoDi(ex, nome);
  if(tutteAlTop){
    const pct = kgMax > 0 ? inc/kgMax*100 : 0;
    const nota = pct > 12
      ? ` Sono +${nf(pct,0)}%: se il salto è troppo, aggiungi prima ripetizioni oltre le ${top}, oppure usa i micro-dischi se la palestra li ha.`
      : '';
    return { kg:kgMax + inc, su:true,
      testo:`Hai chiuso ${top} rep su tutte le serie a ${nf(kgMax,1)} kg: sali a ${nf(kgMax+inc,2)} kg.${nota}` };
  }
  return { kg:kgMax,
    testo:`Ultima volta ${nf(kgMax,1)} kg × ${reps.join('·')}. Resta a ${nf(kgMax,1)} kg finché non chiudi ${top} rep su tutte.` };
}

/* ── dieta ──────────────────────────────────────────────────────────────── */
/* Risolutore delle grammature. Muove tre leve — carboidrati, proteine magre,
   grassi — e, solo se i grassi sfondano da soli, ritocca le proteine grasse
   (salmone, manzo, ricotta), che portano grassi e proteine insieme.
   Restano ferme uova, feta, verdure e caffè. */
const bordi = a => { const x = ALIMENTI[a]; return [x.lo ?? 1, x.hi ?? 1]; };

function equivalente(vecchio, g, nuovo){
  const A = ALIMENTI[vecchio], B = ALIMENTI[nuovo];
  if(!A || !B) return g;
  const k = (A.c >= A.p && A.c >= A.f) ? 'c' : (A.f > A.p ? 'f' : 'p');
  if(!B[k]) return g;
  return Math.max(B.s, Math.round((A[k]*g/B[k])/B.s)*B.s);
}
/* Voci di partenza: variante del piano scelta, poi eventuali scambi di alimento */
function vociBase(lista, L){
  return lista.map((m,mi) => {
    const src = (L && L.alt && L.alt[mi] && m.alt) ? m.alt : m.i;
    return src.map(([a,g],ii) => {
      const sw = L && L.sub && L.sub[mi+':'+ii];
      return sw && ALIMENTI[sw] ? [sw, equivalente(a,g,sw)] : [a,g];
    });
  });
}
const sommaVoci = v => { let p=0,c=0,f=0;
  for(const m of v) for(const [a,g] of m){ const x = ALIMENTI[a]; p+=x.p*g; c+=x.c*g; f+=x.f*g; }
  return { p, c, f }; };

function risolvi(lista, target, L){
  const base = vociBase(lista, L);
  const chiavi = base.map(m => m.map(x => x[0]));
  const g = base.map(m => m.map(x => x[1]));
  const voci = () => chiavi.map((m,mi) => m.map((a,ii) => [a, g[mi][ii]]));
  const quota = (r,k) => { let v=0;
    chiavi.forEach((m,mi) => m.forEach((a,ii) => { if(ALIMENTI[a].r === r) v += ALIMENTI[a][k]*g[mi][ii]; }));
    return v; };
  const scala = (r,k) => {
    chiavi.forEach((m,mi) => m.forEach((a,ii) => { if(ALIMENTI[a].r !== r) return;
      const [lo,hi] = bordi(a);
      g[mi][ii] = Math.min(Math.max(g[mi][ii]*k, base[mi][ii][1]*lo), base[mi][ii][1]*hi); })); };

  for(let n = 0; n < 240; n++){
    for(const [r,k] of [['c','c'],['f','f'],['pG','f'],['pL','p']]){
      const tot = sommaVoci(voci())[k], mia = quota(r,k), serve = target[k] - (tot - mia);
      if(mia > 0.05) scala(r, serve > 0 ? serve/mia : 0.3);
    }
  }
  /* arrotondamento pratico, poi rifinitura sull'alimento con il passo più fine */
  chiavi.forEach((m,mi) => m.forEach((a,ii) => {
    const x = ALIMENTI[a];
    if(x.r !== 'x') g[mi][ii] = Math.max(x.s, Math.round(g[mi][ii]/x.s)*x.s);
  }));
  for(const [r,k] of [['c','c'],['f','f'],['pL','p']]){
    for(let n = 0; n < 400; n++){
      const d = target[k] - sommaVoci(voci())[k];
      if(Math.abs(d) < 0.4) break;
      let best = null;
      chiavi.forEach((m,mi) => m.forEach((a,ii) => {
        const x = ALIMENTI[a];
        if(x.r !== r || x[k] <= 0) return;
        const passo = x[k]*x.s;
        if(passo > Math.abs(d)*2.05) return;
        if(!best || passo > best.passo) best = { mi, ii, passo, s:x.s };
      }));
      if(!best) break;
      const a = chiavi[best.mi][best.ii], [lo,hi] = bordi(a), b = base[best.mi][best.ii][1];
      const nuovo = g[best.mi][best.ii] + (d > 0 ? best.s : -best.s);
      if(nuovo < Math.max(best.s, b*lo) || nuovo > b*hi) break;
      g[best.mi][best.ii] = nuovo;
    }
  }
  return chiavi.map((m,mi) => m.map((a,ii) => [a, g[mi][ii]]));
}
const macroDi = items => { let p=0,c=0,f=0;
  for(const [a,g] of items){ const x = ALIMENTI[a]; p+=x.p*g; c+=x.c*g; f+=x.f*g; }
  return { p, c, f, k: 4*p + 4*c + 9*f }; };
const grammi = (a,g) => { const u = ALIMENTI[a].u;
  return u === 'pz' ? `${nf(g)}` : `${nf(g)}${u ? ' '+u : ' g'}`; };
const pesata = a => ALIMENTI[a].w ? ` <span class="w">${ALIMENTI[a].w}</span>` : '';

function tipoPastoDi(d){
  const f = faseDi(d);
  const salvato = S.pasti[d] && S.pasti[d].tipo;
  if(salvato && DIETE[f.id][salvato]) return salvato;
  const auto = (GIORNO_DIETA[f.id]||{})[dalISO(d).getDay()];
  return auto || 'riposo';
}
function pastiDi(d){
  const f = faseDi(d), t = tipoPastoDi(d), cfg = DIETE[f.id][t];
  const allenamento = !!(GIORNO_DIETA[f.id]||{})[dalISO(d).getDay()] && t !== 'riposo' && t !== 'riposo13';
  const lista = listaDi(cfg, allenamento), target = targetDi(cfg);
  const L = S.pasti[d];
  return { fase:f, tipo:t, cfg, target, lista, voci: risolvi(lista, target, L) };
}
/* Completa le chiavi mancanti invece di controllarne una sola: il giorno puo'
   arrivare da un backup scritto da una versione precedente, e li' bastava una
   chiave assente per far saltare tutta la scheda Dieta. */
function pastoLog(d){
  const L = S.pasti[d] || (S.pasti[d] = { tipo:null, mod:Date.now() });
  if(!L.ok)  L.ok  = {};
  if(!L.alt) L.alt = {};
  if(!L.sub) L.sub = {};
  if(!Array.isArray(L.extra)) L.extra = [];
  return L;
}
function totaliDieta(d){
  const { voci } = pastiDi(d), L = pastoLog(d);
  const t = { k:0,p:0,c:0,f:0 }, piano = { k:0,p:0,c:0,f:0 };
  voci.forEach((items,i) => {
    const m = macroDi(items);
    piano.k += m.k; piano.p += m.p; piano.c += m.c; piano.f += m.f;
    if(L.ok[i]){ t.k += m.k; t.p += m.p; t.c += m.c; t.f += m.f; }
  });
  for(const x of (L.extra||[])){ t.k += +x.k||0; t.p += +x.p||0; t.c += +x.c||0; t.f += +x.f||0; }
  return { fatto:t, piano };
}

/* ── medie dei 7 giorni — la regola con cui il piano decide ─────────────── */
function media7(fineISO, giorni=7){
  let n = 0; const t = { k:0,p:0,c:0,f:0 };
  let spuntati = 0, previsti = 0;
  for(let i = 0; i < giorni; i++){
    const d = piuGiorni(fineISO,-i), L = S.pasti[d];
    const { lista } = pastiDi(d);
    previsti += lista.length;
    if(!L) continue;
    const fatti = Object.values(L.ok||{}).filter(Boolean).length;
    spuntati += fatti;
    if(!fatti && !(L.extra||[]).length) continue;
    const x = totaliDieta(d).fatto;
    t.k += x.k; t.p += x.p; t.c += x.c; t.f += x.f; n++;
  }
  return { n, media: n ? { k:t.k/n, p:t.p/n, c:t.c/n, f:t.f/n } : null,
           aderenza: previsti ? spuntati/previsti : 0, spuntati, previsti };
}
function mediaPeso(fineISO, giorni=7){
  const v = S.corpo.filter(x => x.peso && x.d <= fineISO && x.d > piuGiorni(fineISO,-giorni));
  return v.length ? { m: v.reduce((a,b) => a+ +b.peso, 0)/v.length, n:v.length } : null;
}
function andamentoPeso(d){
  const a = mediaPeso(d), b = mediaPeso(piuGiorni(d,-7));
  if(!a || !b) return null;
  return { ora:a.m, prima:b.m, delta:a.m-b.m, n:a.n, nPrima:b.n };
}
/* Quante volte un alimento compare nei 7 giorni che finiscono oggi */
function frequenza7(alimento, fineISO){
  let n = 0;
  for(let i = 0; i < 7; i++){
    const d = piuGiorni(fineISO,-i);
    const { voci } = pastiDi(d);
    if(voci.some(items => items.some(([a]) => a === alimento))) n++;
  }
  return n;
}
/* Lista della spesa: somma degli alimenti sui prossimi 7 giorni */
function spesa(daISO, giorni=7){
  const somma = {};
  for(let i = 0; i < giorni; i++){
    const { voci } = pastiDi(piuGiorni(daISO,i));
    for(const items of voci) for(const [a,g] of items){
      if(a === 'caffe') continue;
      somma[a] = (somma[a]||0) + g;
    }
  }
  const gruppi = { Proteine:[], Carboidrati:[], Grassi:[], Verdura:[] };
  for(const [a,g] of Object.entries(somma)){
    const x = ALIMENTI[a];
    const fam = a === 'verdure' ? 'Verdura' : (famigliaDi(a) === 'c' ? 'Carboidrati' : (famigliaDi(a) === 'f' ? 'Grassi' : 'Proteine'));
    gruppi[fam].push([a, g]);
  }
  for(const k of Object.keys(gruppi)) gruppi[k].sort((a,b) => b[1]-a[1]);
  return gruppi;
}

/* ── volume ─────────────────────────────────────────────────────────────── */
function serieSettimana(fineISO, giorni=7){
  const per = {}, fr = {}; let tonn = 0, tot = 0;
  for(let i=0;i<giorni;i++){
    const d = piuGiorni(fineISO,-i), L = S.sess[d]; if(!L) continue;
    const s = SESS[L.sid]; if(!s) continue;
    s.ex.forEach((_,idx) => {
      const ex = exDi(s, idx, d);
      const righe = (L.set[idx]||[]).filter(serieValida);
      if(!righe.length) return;
      per[ex.g] = (per[ex.g]||0) + righe.length;
      fr[ex.g] = (fr[ex.g]||0) + righe.length;
      for(const g of secDi(ex.n)) if(g !== ex.g) fr[g] = (fr[g]||0) + righe.length/2;
      tot += righe.length;
      for(const r of righe) if(+r.kg > 0 && +r.rep > 0) tonn += +r.kg * +r.rep;
    });
  }
  return { per, fr, tonn, tot };
}

/* ── bilanciere: dischi per lato ────────────────────────────────────────── */
const DISCHI = [[25,'var(--p25)'],[20,'var(--p20)'],[15,'var(--p15)'],[10,'var(--p10)'],
                [5,'var(--p5)'],[2.5,'var(--p2)'],[1.25,'var(--p1)']];
function dischiPerLato(tot, barra=20){
  let lato = (tot - barra)/2;
  if(lato <= 0) return null;
  const out = [];
  for(const [kg,col] of DISCHI){
    while(lato >= kg - 0.001){ out.push([kg,col]); lato -= kg; }
  }
  return { lista:out, resto: Math.round(lato*100)/100 };
}

/* ── interfaccia di servizio ────────────────────────────────────────────── */
let toastT = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}
function apriSheet(titolo, html, dopo){
  const s = $('#sheet');
  s.innerHTML = `<div class="pane" role="dialog" aria-modal="true" aria-label="${esc(titolo)}">
    <div class="hd"><h2>${esc(titolo)}</h2><button class="iconbtn sp" data-chiudi aria-label="Chiudi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></div><div class="bd">${html}</div></div>`;
  s.hidden = false;
  s.onclick = ev => { if(ev.target === s || ev.target.closest('[data-chiudi]')) chiudiSheet(); };
  if(dopo) dopo(s);
  const primo = s.querySelector('input,select,textarea,button:not([data-chiudi])');
  if(primo) primo.focus();
}
function chiudiSheet(){ const s = $('#sheet'); s.hidden = true; s.innerHTML = ''; }
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && !$('#sheet').hidden) chiudiSheet(); });

    : '<path d="M20 13.5A8.2 8.2 0 0 1 10.5 4a8.5 8.5 0 1 0 9.5 9.5z"/>';

/* ── cronometro di recupero ─────────────────────────────────────────────── */
/* Ancorato all'orologio, non a un contatore che scende: con lo schermo spento
   iOS congela gli intervalli e un timer a decremento tornerebbe indietro. */
let WAKE = null;
async function tieniAcceso(){
  try{ if(!WAKE && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen'); }
  catch(err){ /* negato o non disponibile: si continua senza */ }
}
function lasciaSpegnere(){ if(WAKE){ try{ WAKE.release(); }catch(err){} WAKE = null; } }

function avviaTimer(sec, etichetta){
  fermaTimer();
  let tot = sec, scadenza = Date.now() + sec*1000;
  $('#timerbar').hidden = false; $('#timerL').textContent = etichetta || 'Recupero';
  const disegna = () => {
    const restano = Math.max(0, Math.round((scadenza - Date.now())/1000));
    $('#timerT').textContent = `${Math.floor(restano/60)}:${String(restano%60).padStart(2,'0')}`;
    $('#timerRing').setAttribute('stroke-dashoffset', String(97.4 * (1 - restano/tot)));
    return restano;
  };
  disegna(); tieniAcceso();
  TIMER = { disegna,
    id: setInterval(() => { if(disegna() <= 0){ fermaTimer(); toast('Recupero finito — vai con la serie'); } }, 500),
    add: () => { scadenza += 30000; tot += 30; disegna(); } };
}
function fermaTimer(){ if(TIMER){ clearInterval(TIMER.id); TIMER = null; } $('#timerbar').hidden = true; }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  if(TIMER){ TIMER.disegna(); tieniAcceso(); }   // riaggancia lo schermo al rientro
});
$('#timerStop').onclick = fermaTimer;
$('#timerAdd').onclick  = () => TIMER && TIMER.add();

function pill(txt, cls) { return `<span class="chip ${cls||''}">${esc(txt)}</span>`; }
function statoOggi(d){
  const L = S.sess[d]; if(!L) return { fatte:0, totali:0 };
  const s = SESS[L.sid]; if(!s) return { fatte:0, totali:0 };
  let fatte = 0, totali = 0;
  s.ex.forEach((_,i) => {
    const ex = exDi(s, i, d);
    totali += serieDi(ex, L.tipo || 'base') + ((L.piu||{})[i] || 0);
    fatte  += (L.set[i]||[]).filter(serieValida).length;
  });
  return { fatte, totali };
}

/* anelli macro — tre serie categoriali validate (blu / arancio / acqua) */
function anelli(fatto, target){
  const pct = clamp(fatto.k / target.k, 0, 1.35);
  const R = 46, C = 2*Math.PI*R;
  const riga = (nome,v,t,col) => {
    const p = clamp(v/t,0,1.3);
    return `<div class="macro"><i style="background:${col}"></i>
      <span class="nm">${nome}</span>
      <span class="vl">${nf(v)}<s> / ${nf(t)} g</s></span>
      <div style="grid-column:1/-1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:-4px">
        <div style="height:100%;width:${(p*100).toFixed(1)}%;background:${col};border-radius:3px"></div></div></div>`;
  };
  return `<div class="rings">
    <svg viewBox="0 0 110 110" role="img" aria-label="Calorie: ${nf(fatto.k)} su ${nf(target.k)}">
      <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="9"/>
      <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 55 55)"/>
      <text x="55" y="52" text-anchor="middle" class="val" style="font-size:21px;fill:var(--ink);font-family:var(--display)">${nf(fatto.k)}</text>
      <text x="55" y="68" text-anchor="middle" style="font-size:10px;fill:var(--ink-3);font-family:var(--display);letter-spacing:.12em">DI ${nf(target.k)}</text>
    </svg>
    <div class="macros">
      ${riga('Proteine', fatto.p, target.p, 'var(--m-pro)')}
      ${riga('Carboidrati', fatto.c, target.c, 'var(--m-cho)')}
      ${riga('Grassi', fatto.f, target.f, 'var(--m-fat)')}
    </div></div>`;
}

function cardEsercizio(ex, i, d, f, tipo){
  const base = serieDi(ex,tipo), extra = (log(d).piu||{})[i] || 0;
  const n = base + extra, righe = serieLog(d,i,base);
  const fatte = righe.filter(serieValida).length;
  const sug = suggerimento(ex, ex.n, d);
  const ult = ultimaVolta(ex.n, d);
  const best = miglioreDi(ex.n);
  const aperto = APERTI.has(i);
  const kgAttuale = Math.max(0, ...righe.map(r => +r.kg || 0));
  const bilanciere = /bilanciere|panca piana|rematore|hip thrust|military/i.test(ex.n) && kgAttuale >= 20;
  const dp = bilanciere ? dischiPerLato(kgAttuale) : null;

  const testa = `<div class="idx">${fatte >= n ? ICO.check : i+1}</div>
    <div class="nm"><b>${esc(ex.nv || ex.n)}</b>
      <span>${n} × ${esc(repDi(ex,f))} · ${esc(ex.i)}${ex.rec?` · rec ${ex.rec>=60?Math.round(ex.rec/60)+' min':ex.rec+'s'}`:''}</span></div>
    <div class="prog">${ult ? `<span class="ultkg">${nf(Math.max(...ult.righe.map(r=>+r.kg||0)),1)} kg</span>` : ''}${fatte}/${n}</div>
    <div class="caret">${ICO.chevron}</div>`;

  const tag = [
    ex.p ? pill('Priorità','acc') : '',
    ex.ernia ? pill('Ernia · conservativo','crit') : '',
    isWM(ex,tipo) ? pill('Widowmaker','warn') : '',
    ex.ss ? pill('Superset','line') : '',
    ex.nuovo ? pill('Aggiunto','good') : '',
    ex.sost ? pill('Sostituito','acc') : '',
    ex.mio ? pill('Testo tuo','line') : '',
    ex.fv ? pill(ex.fv==='forza'?'Blocco forza':'Blocco volume','line') : ''
  ].filter(Boolean).join('');

  /* I numeri della volta prima entrano come segnaposto in ogni campo, serie per
     serie: si vedono senza aprire niente e senza essere registrati per sbaglio.
     Il tasto "Ripeti la volta prima" li scrive davvero, ed è una tua scelta. */
  const prec = j => (ult && ult.righe[j]) ? ult.righe[j] : null;
  const setRighe = righe.map((r,j) => {
    const q = prec(j);
    return `<div class="setrow ${r.ok?'ok':''}">
      <span class="sn">${r.wm ? 'WM' : j+1}</span>
      <input type="number" inputmode="decimal" step="0.5" placeholder="${q ? nf(q.kg,1) : 'kg'}" aria-label="Serie ${j+1}, carico in kg${q?', la volta prima '+nf(q.kg,1)+' kg':''}"
             data-i="${i}" data-s="${j}" data-k="kg" value="${r.kg}">
      <input type="number" inputmode="numeric" step="1" placeholder="${q ? q.rep : (ex.tempo?'sec':'rep')}" aria-label="Serie ${j+1}, ripetizioni${q?', la volta prima '+q.rep:''}"
             data-i="${i}" data-s="${j}" data-k="rep" value="${r.rep}">
      <input class="rir" type="number" inputmode="numeric" step="1" placeholder="${q && q.rir ? q.rir : 'RIR'}" aria-label="Serie ${j+1}, RIR"
             data-i="${i}" data-s="${j}" data-k="rir" value="${r.rir ?? ''}">
      <button class="tick" data-tick="${i}:${j}" aria-label="${r.ok?'Annulla':'Conferma'} serie ${j+1}">${ICO.check}</button>
    </div>`;
  }).join('');

  return `<details class="exc ${fatte>=n?'done':''}" data-ex="${i}" ${aperto?'open':''}>
    <summary>${testa}</summary>
    <div class="body">
      ${tag ? `<div class="row wrapf" style="padding:11px 0 2px">${tag}</div>` : ''}
      ${tecnicheDi(ex.i).length ? `<div class="row wrapf" style="padding:8px 0 2px">
        ${tecnicheDi(ex.i).map(k => `<button class="chip line" data-tec="${esc(k)}" style="cursor:pointer">${ICO.info} ${esc(TECNICHE[k][0])}</button>`).join('')}
      </div>` : ''}
      ${/sissy/i.test(ex.n) ? `<button class="chip line" data-sissy="1" style="cursor:pointer;margin-top:6px">${ICO.info} Progressione del range</button>` : ''}
      <div class="sethead"><span>Serie</span><span>Carico</span><span>${ex.tempo?'Secondi':'Rep'}</span><span>RIR</span><span></span></div>
      ${setRighe}
      ${dp ? striscia(dp, kgAttuale) : ''}
      <div class="row wrapf noprint" style="margin-top:11px">
        ${ex.rec ? `<button class="btn sm" data-rec="${ex.rec}">Recupero ${ex.rec>=60?Math.round(ex.rec/60)+' min':ex.rec+'s'}</button>` : ''}
        <button class="btn sm ghost" data-piu="${i}:1">${ICO.piu} Serie</button>
        <button class="btn sm ghost" data-sost="${i}">Sostituisci</button>
        <button class="btn sm ghost" data-testi="${i}">Testo</button>

/* ── PROGRESSI ──────────────────────────────────────────────────────────── */
function nomiEsercizi(){
  const set = new Set();
  /* Object.entries e non values: exDi ha bisogno della data per sapere se in
     quella giornata l'esercizio era sostituito. Con Object.values la data era
     undefined e l'intera scheda Progressi si rompeva appena c'era un carico
     registrato. */
  for(const [d,L] of Object.entries(S.sess)){
    const s = SESS[L.sid]; if(!s) continue;
    s.ex.forEach((_,i) => { if((L.set[i]||[]).some(r => serieValida(r) && +r.kg > 0)) set.add(exDi(s,i,d).n); });
  }
  return [...set].sort((a,b) => a.localeCompare(b,'it'));
}

/* grafici: SVG generati sui dati, con crosshair e tooltip */
function grafLinea(punti, o){
  const W = 384, H = 168, m = { t:12, r:12, b:22, l:34 };
  const ys = punti.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi-lo) * 0.18 || Math.max(1, hi*0.02); lo -= pad; hi += pad;
  const X = i => m.l + (punti.length<2?0:i*(W-m.l-m.r)/(punti.length-1));
  const Y = y => m.t + (H-m.t-m.b) * (1 - (y-lo)/(hi-lo || 1));
  const dLine = punti.map((p,i) => `${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dArea = `${dLine} L${X(punti.length-1).toFixed(1)} ${H-m.b} L${X(0).toFixed(1)} ${H-m.b} Z`;
  const tacche = [lo, (lo+hi)/2, hi];

  let media = '';
  if(o.media && punti.length >= 3){
    const mm = punti.map((p,i) => {
      const win = punti.slice(Math.max(0,i-o.media+1), i+1);
      return { x:p.x, y: win.reduce((a,b) => a+b.y,0)/win.length };
    });
    media = `<path class="trend" d="${mm.map((p,i) => `${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}"/>`;
  }
  const hit = punti.map((p,i) => `<rect class="hit" x="${(X(i)-11).toFixed(1)}" y="${m.t}" width="22" height="${H-m.t-m.b}"
      data-tip="${esc(dataCorta(p.x))} · ${nf(p.y, o.unita==='kg'?1:2)} ${o.unita}" data-x="${X(i).toFixed(1)}" data-y="${Y(p.y).toFixed(1)}"></rect>`).join('');

  return `<div class="chartwrap" data-chart="${o.id}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"
         aria-label="Andamento: da ${nf(Math.min(...ys),1)} a ${nf(Math.max(...ys),1)} ${o.unita}">
      ${tacche.map(v => `<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
        <text x="${m.l-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v,1)}</text>`).join('')}
      <path class="ar" d="${dArea}"/><path class="ln" d="${dLine}"/>${media}
      ${punti.length<=14 ? punti.map((p,i) => `<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2"/>`).join('') :
        `<circle class="dot" cx="${X(punti.length-1).toFixed(1)}" cy="${Y(punti[punti.length-1].y).toFixed(1)}" r="4"/>`}
      <text x="${m.l}" y="${H-8}">${esc(dataCorta(punti[0].x))}</text>
      <text x="${W-m.r}" y="${H-8}" text-anchor="end">${esc(dataCorta(punti[punti.length-1].x))}</text>
      ${hit}
    </svg><div class="tip"></div></div>`;
}
function grafBarre(punti, o){
  const W = 384, H = 140, m = { t:10, r:10, b:22, l:34 };
  const hi = Math.max(...punti.map(p => p.y), 0.1);
  const bw = (W-m.l-m.r)/punti.length;
  const Y = y => m.t + (H-m.t-m.b) * (1 - y/hi);
  return `<div class="chartwrap" data-chart="${o.id}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"
         aria-label="Tonnellaggio per settimana, massimo ${nf(hi,1)} ${o.unita}">
      ${[0,hi/2,hi].map(v => `<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
        <text x="${m.l-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v,1)}</text>`).join('')}
      ${punti.map((p,i) => {
        const h = Math.max(0, H-m.b-Y(p.y));
        return `<rect class="brm ${p.y?'':'dim'}" x="${(m.l+i*bw+3).toFixed(1)}" y="${Y(p.y).toFixed(1)}"
          width="${(bw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="4"></rect>
        <rect class="hit" x="${(m.l+i*bw).toFixed(1)}" y="${m.t}" width="${bw.toFixed(1)}" height="${H-m.t-m.b}"
          data-tip="sett. del ${esc(p.lab)} · ${nf(p.y,2)} ${o.unita}" data-x="${(m.l+i*bw+bw/2).toFixed(1)}" data-y="${Y(p.y).toFixed(1)}"></rect>`;
      }).join('')}
      <text x="${m.l}" y="${H-8}">${esc(punti[0].lab)}</text>
      <text x="${W-m.r}" y="${H-8}" text-anchor="end">${esc(punti[punti.length-1].lab)}</text>
    </svg><div class="tip"></div></div>`;
}

    <div class="card"><div class="hd"><h3>Come sono costruite</h3></div><div class="bd stack-s">
      <p class="small muted" style="margin:0">Queste regole hanno generato la scheda <b>4 sedute</b>, riga per riga.
        La <b>4 sedute Top</b> era partita dal tuo elenco di esercizi e serie; dalla v34 rispetta anch’essa tutte
        le regole, tetto delle tre serie per esercizio compreso. Le sei correzioni che ci sono volute, e perché,
        sono scritte in fondo.</p>
      <p class="small" style="margin:0"><b>0. Il volume settimanale è fissato, non dedotto.</b> Petto 8, dorso 8,
        trapezi 3, spalle 7, bicipiti 8, tricipiti 8, accosciata 8, femorali 9, polpacci 3, addome 6. Le schede
        partono da lì e ci arrivano esattamente: quanti esercizi, come si dividono e quanto dura una seduta sono
        conseguenze di quei numeri, non scelte libere. La <b>4 sedute</b> li centra tutti tranne spalle e braccia,
        che scendono di due serie ciascuna — e sotto è scritto perché. La <b>Top</b> parte da un elenco di esercizi
        invece che dai numeri, e infatti finisce sopra sull’accosciata e sotto su dorso e trapezi.</p>
      <p class="small" style="margin:0"><b>1. La tensione meccanica è il driver, non il bruciore.</b> Il pompaggio e i
        dolori del giorno dopo non sono indici di crescita: il primo è un effetto collaterale, i secondi sono un
        sottoprodotto che rallenta il recupero. Quello che conta è quanta tensione il muscolo regge, e per reclutare le
        fibre che crescono di più il sistema nervoso dev’essere costretto a esprimere il massimo — cioè carichi alti o
        serie che finiscono vicino al cedimento.</p>
      <p class="small" style="margin:0"><b>2. RIR 0–2 su tutto quello che alleni davvero.</b> Compound a 1-2 ripetizioni
        di margine, isolamento a cedimento tecnico. Le serie lontane dal cedimento non sono allenamento leggero: sono
        fatica senza stimolo.</p>
      <p class="small" style="margin:0"><b>3. Un’alzata di forza in testa a ogni seduta.</b> Panca piana 4-6, military
        press coi manubri 5-7, hack squat 5-8, stacco romeno 6-8, pressa 6-8: prima cosa dopo il riscaldamento, quattro
        minuti di recupero, carico che sale appena chiudi il tetto del range su tutte e tre le serie. Non è un blocco di
        powerlifting appiccicato davanti: è che la tensione più alta la esprimi da fresco, e su un range basso il carico
        è l’unica variabile che si muove. Tutto quello che viene dopo lavora su range più alti, dove è la vicinanza al
        cedimento a fare il lavoro.</p>
      <p class="small" style="margin:0"><b>4. Un solo rematore e un solo leg curl per giornata, e nelle sedute di gamba
        solo gambe.</b> Due rematori nello stesso giorno sono lo stesso movimento fatto due volte sulla stessa panca: il
        secondo lo fai già stanco e non aggiunge un angolo nuovo. Lo stesso vale per due flessioni del ginocchio di
        fila. Sulle braccia in coda a una seduta di gambe le due schede si dividono di proposito: nella <b>Top</b> non ce ne
        sono, nella <b>4 sedute</b> i <b>bicipiti stanno lì</b> — non come riempitivo, ma perché è l’unico posto in cui
        arrivano senza il lavoro indiretto delle tirate, e ci fanno tre serie piene invece di due in superset. È la
        differenza vera fra le due schede. Da qui anche la scelta della terza
        dose di dorso, che non può essere un rematore: <b>pullover ai cavi</b> nella 4 sedute, <b>lat machine a un
        braccio</b> nella Top — lì il pullover non serve, perché la verticale pesante del lunedì e quella a range alto
        del giovedì coprono già il dorsale meglio. E da qui i due <b>leg curl separati</b> sulle due giornate di gamba,
        e i <b>trapezi tutti in una seduta sola</b>.</p>
      <p class="small" style="margin:0"><b>5. Da due a tre serie per esercizio, mai di più.</b> Il volume si alza
        aggiungendo un esercizio, non serie allo stesso: dalla quarta o quinta serie consecutiva sullo stesso
        movimento la tensione che riesci a produrre è già scesa, e quelle serie le fai ma non allenano. Tutte le sedute
        rispettano il tetto, nessuna esclusa.</p>
      <p class="small" style="margin:0"><b>6. Stabilità: dove serve equilibrio, il muscolo riceve meno.</b> Se un
        esercizio chiede di stare in piedi su una gamba o di controllare un bilanciere libero, il sistema nervoso frena
        l’output per proteggerti, e il muscolo bersaglio non arriva mai al suo limite. Per questo qui macchine e cavi
        non sono un ripiego: hack squat guidato, pressa, rematore col petto appoggiato, military da seduto, laterali e
        curl ai cavi. Ed è anche il motivo per cui lo <b>split squat bulgaro è uscito</b>: unilaterale in equilibrio,
        chiedeva stabilità e restituiva meno quadricipite.</p>
      <p class="small" style="margin:0"><b>7. Il carico deve pesare dove il muscolo è lungo, e non deve mai azzerarsi.</b>
        Un esercizio è buono quando la resistenza dell’attrezzo segue la forza che il muscolo può esprimere a quell’angolo,
        senza punti morti. Da qui il <b>curl ai cavi dietro il corpo</b>, il <b>french press ai cavi</b> con la corda
        alla carrucola bassa e le <b>alzate laterali ai cavi</b> invece che coi manubri, dove in basso il carico è zero.
        E sulle <b>croci coi manubri</b>, che il punto morto in cima ce l’hanno: si chiude a due terzi e non si arriva a
        toccare, perché lì il petto non regge più niente.</p>
      <p class="small" style="margin:0"><b>8. In allungamento, non in accorciamento.</b> Mettere il muscolo sotto
        massima tensione mentre è <em>lungo</em> dà un segnale di crescita superiore a quello che si ottiene lavorando
        dove è corto. È la ragione per cui l’<b>hip thrust è uscito del tutto</b>: caricava il gluteo nel punto in cui è
        più corto, e la stessa anca ce l’ha già in allungamento — profondo — sullo stacco romeno e sulla pressa. Al suo
        posto lo stacco romeno è salito a un’alzata di forza vera, 6-8 ripetizioni e quattro minuti. Stessa logica sulle
        <b>croci su panca inclinata</b> al posto di qualunque chiusura ai cavi, e sul <b>sissy squat</b>, dove il retto
        femorale lavora allungato dall’anca estesa.</p>
      <p class="small" style="margin:0"><b>9. Sulle braccia, i due estremi della curva.</b> Il tricipite li ha
        entrambi e puliti: <b>french press overhead</b> col gomito sopra la testa, dove il capo lungo è teso, e
        <b>push-down</b> col gomito al fianco, dove è corto. Sul bicipite le due dosi migliori sono tutte e due in
        allungamento — <b>curl ai cavi dietro il corpo</b> e <b>curl coi manubri su panca inclinata</b>, in tutti e due
        il braccio sta dietro la linea del busto — e va bene così: è lì che il segnale è più forte. Il
        <b>curl hammer</b> non è la dose in accorciamento, è la dose per brachiale e brachioradiale, che con la presa
        supina non lavorano mai davvero. Nella <b>Top</b> i quattro curl coprono quattro cose diverse: il
        <b>bilanciere</b> per il carico, il <b>cavo dietro il corpo</b> per la tensione dove il bilanciere non ne ha,
        la <b>panca inclinata</b> per il capo lungo che parte già allungato, l’<b>hammer</b> per il brachiale.
        Nessuno dei quattro ripete un altro.</p>
      <p class="small" style="margin:0"><b>10. Una tirata verticale e una orizzontale.</b> Verticale: <b>lat
        machine unilaterale con la maniglia</b>, un braccio per volta — il range è più ampio e la scapola può salire
        davvero, cosa che con la barra a due mani non succede. Orizzontale: <b>rematore coi manubri a busto
        appoggiato</b>, dove il limite non lo mette la schiena bassa. Il trapezio ha il suo, il <b>rematore coi gomiti
        alti</b> su panca inclinata: stesso attrezzo, gomito alto invece che lungo il fianco, e le scapole si chiudono
        invece di scorrere indietro. Le scrollate sono uscite: caricano il trapezio superiore in accorciamento e basta.</p>
      <p class="small" style="margin:0"><b>11. Recuperi da 2 a 4 minuti.</b> Servono a ricaricare la fosfocreatina e a
        far scendere la fatica centrale: con un minuto di pausa la serie dopo parte già scarica, e la tensione
        meccanica — che è il punto — non c’è più. L’isolamento sta a 120-150 secondi, le alzate di forza a 3 minuti e
        mezzo o 4. È il motivo per cui una seduta da sole 12 serie può durare quasi un’ora: il tempo è quasi tutto
        recupero, ed è speso bene.</p>
      <p class="small" style="margin:0"><b>12. Ogni gruppo due volte a settimana.</b> Allenare un muscolo una volta sola
        obbliga a stipare troppe serie nello stesso giorno, e dalla quinta o sesta in poi la prestazione crolla: quelle
        serie le fai, ma non allenano. Lo stesso volume diviso su due giorni tiene alta la qualità di tutte. Vale anche
        per le gambe, che nel giro precedente avevo accorpato in due giornate monotematiche — era un errore. Le due
        eccezioni sono <b>trapezi e polpacci</b>, 3 serie a settimana ciascuno: a quel volume dividere in due
        significherebbe una serie e mezza per seduta, cioè niente. Sotto le 4-5 serie settimanali la frequenza doppia
        non ha più senso.</p>
      <p class="small" style="margin:0"><b>13. Progressione in tre passi, in quest’ordine.</b> Prima si fissano tecnica e
        range, col fermo di un secondo in allungamento. Poi salgono le ripetizioni fino al top del range, a parità di
        RIR. Solo alla fine sale il carico. Caricare di più a scapito dell’esecuzione non è sovraccarico progressivo.</p>
      <p class="small" style="margin:0"><b>9. Il tempo è un vincolo, non un obiettivo — e le sedute sono costruite
        intorno all’ernia.</b> Il tetto era 65 minuti; da v36 il lunedì della Top ne fa 69, perché ci sono dentro tre
        alzate pesanti da 3-4 minuti di recupero e due dosi di deltoide laterale. Quei minuti sono quasi tutti
        recupero, e il recupero non è tempo perso: è quello che tiene alta la tensione nella serie dopo. Il limite
        vero resta un altro — niente squat libero né spinte sopra la testa in piedi, che sono i gesti che alzano di
        più la pressione addominale.</p>
      <p class="small" style="margin:0"><b>L’addome è un muscolo come gli altri.</b> Niente centinaia di ripetizioni
        e niente circuiti: <b>D’Annunzio crunch</b>, 3 serie da 10-15 con eccentrica di tre secondi e recupero pieno,
        sovraccaricabile con un disco sul petto. Si fa sulla lat machine, gambe bloccate sotto il pad, col busto che
        scende oltre l’appoggio: il crunch normale lavora solo in accorciamento e senza eccentrica, qui c’è tensione
        dove l’addome è allungato. Con l’ernia inguinale è l’unico esercizio del piano che alza la pressione
        addominale: si espira sempre salendo, si parte a corpo libero, e il disco si aggiunge solo se non tira.</p>
      <p class="small" style="margin:0"><b>Le sei correzioni della v34, per avvicinare la Top a Rabasco e Nippard.</b>
        <b>1.</b> Il <b>rematore Yates</b> è diventato <b>rematore coi manubri a gomiti alti</b>, petto appoggiato
        sulla panca inclinata: col bilanciere in piedi devi stabilizzare busto e schiena bassa, e per Rabasco è
        esattamente il caso in cui il sistema nervoso frena e il muscolo bersaglio non arriva al limite — con
        l’ernia, poi, il bracing è la cosa da evitare. Il gomito alto chiude le scapole, così i <b>trapezi</b>
        passano da 0 a 3 serie senza aggiungere niente. <b>2.</b> Nell’Upper B entra una seconda dose di dorso che
        non è un rematore, così il vincolo tiene: dalla v37 è la <b>lat machine a un braccio</b>, che riporta il
        dorso a 8 serie e la tirata verticale a frequenza 2× — pesante e zavorrata il lunedì, a range alto il
        giovedì. <b>3.</b> Le <b>alzate laterali</b> passano dai manubri ai <b>cavi</b> e da 4 serie a 3: col
        manubrio, in basso, il carico sul deltoide è zero proprio dove il muscolo è allungato, e il tetto delle tre
        serie vale anche qui. <b>4.</b> L’<b>hip thrust</b> lascia il posto allo <b>stacco a gambe tese coi
        manubri</b>: stessa anca, ma caricata dove il femorale è lungo invece che dove il gluteo è corto. <b>5.</b>
        I <b>leg curl</b> salgono a 3 serie ciascuno e i <b>sissy squat</b> scendono a 2: i femorali erano a 7
        contro 11 di quadricipite, ora sono 11 contro 9 — Nippard ed Emmerich il rapporto lo tengono così, non
        rovesciato. <b>6.</b> Sulle <b>trazioni zavorate</b> non ho deciso io: Nippard le tiene, Rabasco preferisce
        la lat a un braccio, e la scheda ti lascia la scelta con scritto quando conviene passare.</p>
      <div class="backup" style="background:var(--accent-soft);color:var(--accent-text)">${ICO.info}
        <span>Un esercizio ripetuto nella settimana non è un errore. Nella <b>Top</b> il tricipite overhead compare
        in tutte e due le sedute alte, 2 serie per volta, ed è il modo con cui quella scheda dà al capo lungo la
        frequenza doppia; il push-down pure, con la corda il lunedì e col triangolo il giovedì; il sissy squat sta
        in tutte e due le sedute basse, ma con esecuzione diversa (rest-pause il martedì, eccentrica da 5 secondi
        il venerdì). Ripetere il migliore vale più che usarne uno
        peggiore per non ripetersi. Nella <b>4 sedute</b> invece non si ripete niente: ogni esercizio compare una
        volta sola nella settimana, con le sue 3 serie e il suo recupero pieno.</span></div>
    </div></div>` ; })()}
