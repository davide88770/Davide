/* ── backup ─────────────────────────────────────────────────────────────── */
const nomeFile = () => `ghisa-e-grammi-${oggiISO()}.json`;
function fondi(r){
  if(!r || r.v !== 1) throw new Error('formato');
  let n = 0;
  for(const [d,x] of Object.entries(r.sess||{})){
    const l = S.sess[d]; if(!l || (x.mod||0) > (l.mod||0)){ S.sess[d] = x; n++; }
  }
  for(const [d,x] of Object.entries(r.pasti||{})){
    const l = S.pasti[d]; if(!l || (x.mod||0) > (l.mod||0)){ S.pasti[d] = x; n++; }
  }
  for(const [w,x] of Object.entries(r.check||{})){
    const l = S.check[w]; if(!l || (x.mod||0) > (l.mod||0)){ S.check[w] = x; n++; }
  }
  const m = new Map(S.corpo.map(x => [x.d,x]));
  for(const x of (r.corpo||[])){ const l = m.get(x.d); if(!l || (x.mod||0) > (l.mod||0)){ m.set(x.d,x); n++; } }
  S.corpo = [...m.values()].sort((a,b) => a.d < b.d ? -1 : 1);
  /* I testi riscritti non hanno una data di modifica, quindi non si possono
     confrontare: quelli del file entrano solo dove tu non ne hai gia' uno.
     Su un telefono pulito arrivano tutti; fra due telefoni, ognuno tiene il
     suo e non ti ritrovi un testo cambiato senza averlo toccato. */
  if(!S.testi) S.testi = {};
  for(const [k,x] of Object.entries(r.testi||{})){ if(!S.testi[k]){ S.testi[k] = x; n++; } }
  salva(); return n;
}
async function esporta(){
  const testo = JSON.stringify(S);
  try{
    const dl = window.claude && await window.claude.use('downloads');
    if(dl){ await dl.save({ filename:nomeFile(), data:testo }); S.meta.backup = Date.now(); salva(); toast('Backup salvato'); render(); return; }
  }catch(err){
    if(err && err.code === 'declined'){ toast('Backup annullato'); return; }
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([testo], { type:'application/json' }));
    a.download = nomeFile(); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    S.meta.backup = Date.now(); salva(); toast('Backup scaricato'); render();
  }catch(err){ toast('Backup non riuscito: usa “Copia codice”.'); }
}

function vai(tab){
  S.ui.tab = tab; salva();
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === tab)));
  $$('.view').forEach(v => { v.hidden = v.id !== 'view-' + tab; });
  render();
  window.scrollTo({ top:0, behavior:'instant' });
}
function render(){
  const f = faseDi(S.ui.data);
  $('#brandsub').textContent = `Fase ${f.n} · ${f.nome}`;
  ({ oggi:renderOggi, workout:renderWorkout, dieta:renderDieta, progressi:renderProgressi, piano:renderPiano }[S.ui.tab] || renderOggi)();
  if(typeof agganciaTitolo === 'function') agganciaTitolo();
}

    const [i,j] = cam.dataset.sw.split(':').map(Number);
    const d = S.ui.data, { lista, voci, cfg } = pastiDi(d), L = pastoLog(d);
    const [attuale, gAtt] = voci[i][j];
    const fam = famigliaDi(attuale);
    const orig = ((L.alt && L.alt[i] && lista[i].alt) ? lista[i].alt : lista[i].i)[j];
    apriSheet(`Al posto di ${ALIMENTI[attuale].n}`, `
      <p class="tiny muted" style="margin:0 0 12px">Le quantità sono equivalenti sul macro dominante. Dopo lo scambio l’app
        ribilancia comunque tutta la giornata sul target, quindi il numero definitivo può spostarsi di poco.</p>
      <div class="ed">
        ${SCAMBI[fam].map(a => {
          const g = a === attuale ? gAtt : equivalente(attuale, gAtt, a);
          const x = ALIMENTI[a], mm = { p:x.p*g, c:x.c*g, f:x.f*g };
          const cap = FREQ_MAX[a];
          const usi = cap ? frequenza7(a, d) : 0;
          const troppo = cap && usi >= cap[0];
          return `<button class="edrow" data-scambia="${i}:${j}:${a}" style="width:100%;text-align:left;cursor:pointer${a===attuale?';border-color:var(--accent)':''}">
            <div class="tx"><b>${esc(x.n)}${a===attuale?' · in uso':''}</b>
              <span class="mono">${grammi(a,g)}${x.w?' '+x.w:''} · ${nf(mm.p)}P ${nf(mm.c)}C ${nf(mm.f)}F</span>
              ${cap ? `<span class="tiny" style="color:${troppo?'var(--crit-text)':'var(--ink-3)'}">${usi} volte negli ultimi 7 giorni · ${esc(cap[1])}</span>` : ''}</div>
            ${troppo ? `<span class="chip crit">limite</span>` : ''}</button>`;
        }).join('')}
        ${orig && orig[0] !== attuale ? `<button class="btn ghost wide" data-scambia="${i}:${j}:">Torna a ${esc(ALIMENTI[orig[0]].n)}</button>` : ''}
      </div>`);
    return;
  }
  const sc = el('[data-scambia]');
  if(sc){
    const [i,j,a] = sc.dataset.scambia.split(':');
    const L = pastoLog(S.ui.data);
    if(!a) delete L.sub[i+':'+j]; else L.sub[i+':'+j] = a;
    L.mod = Date.now(); salva(); chiudiSheet(); renderDieta(); return;
  }
  const dx = el('[data-delextra]');
  if(dx){ const L = pastoLog(S.ui.data); L.extra.splice(+dx.dataset.delextra,1); L.mod = Date.now(); salva(); renderDieta(); return; }

  if(el('#listaSpesa')){
    const g = spesa(S.ui.data), da = dataCorta(S.ui.data), a = dataCorta(piuGiorni(S.ui.data,6));
    apriSheet(`Spesa · ${da} – ${a}`, `
      <p class="tiny muted" style="margin:0 0 14px">Sette giorni, con le giornate alimentari che il piano prevede in quelle date.
        I pesi sono quelli da bilancia: crudo per carne, pesce e cereali.</p>
      ${Object.entries(g).filter(([,v]) => v.length).map(([sez,voci]) => `
        <h4 style="font-family:var(--display);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px">${sez}</h4>
        <div class="tblwrap"><table class="tbl"><tbody>
          ${voci.map(([a2,tot]) => { const x = ALIMENTI[a2];
            const q = x.u === 'pz' ? `${nf(Math.ceil(tot))} pz`
                    : tot >= 1000 ? `${nf(tot/1000,2)} kg` : `${nf(Math.round(tot/5)*5)}${x.u ? ' '+x.u : ' g'}`;
            return `<tr><td>${esc(x.n)}${x.w?` <span class="tiny muted">${x.w}</span>`:''}</td><td class="n">${q}</td></tr>`;
          }).join('')}
        </tbody></table></div>`).join('')}`);
    return;
  }
  if(el('#addExtra')){
    apriSheet('Fuori piano', `
      <div class="stack">
        <label class="fld"><span>Che cos’era</span><input type="text" id="xn" placeholder="Pizza · birra · gelato…"></label>
        <div class="fldrow">
          <label class="fld"><span>kcal</span><input type="number" inputmode="numeric" id="xk" placeholder="0"></label>
          <label class="fld"><span>Proteine g</span><input type="number" inputmode="numeric" id="xp" placeholder="0"></label>
          <label class="fld"><span>Carbo g</span><input type="number" inputmode="numeric" id="xc" placeholder="0"></label>
          <label class="fld"><span>Grassi g</span><input type="number" inputmode="numeric" id="xf" placeholder="0"></label>
        </div>
        <button class="btn solid wide" id="xok">Aggiungi</button>
        <p class="tiny muted" style="margin:0">Se non conosci i macro esatti, metti solo le calorie: serve a non perdere il conto della media settimanale.</p>
      </div>`, s => {
      s.querySelector('#xok').onclick = () => {
        const n = s.querySelector('#xn').value.trim() || 'Fuori piano';
        const L = pastoLog(S.ui.data);
        L.extra.push({ n, k:+s.querySelector('#xk').value||0, p:+s.querySelector('#xp').value||0,
                       c:+s.querySelector('#xc').value||0, f:+s.querySelector('#xf').value||0 });
        L.mod = Date.now(); salva(); chiudiSheet(); renderDieta();
      };
    });
    return;
  }

  if(el('#salvaPeso')){
    const p = +$('#pesoIn').value, bf = +$('#bfIn').value;
    if(!p){ toast('Scrivi il peso in kg'); return; }
    const d = S.ui.data, i = S.corpo.findIndex(x => x.d === d);
    const rec = { d, peso:p, bf:bf||null, vita:+$('#vitaIn').value||null, mod:Date.now() };
    if(i >= 0) S.corpo[i] = rec; else S.corpo.push(rec);
    S.corpo.sort((a,b) => a.d < b.d ? -1 : 1);
    salva(); toast('Peso registrato'); render(); return;
  }

  if(el('#chiudiSess')){
    const L = log(S.ui.data); L.fine = Date.now(); L.mod = Date.now(); salva();
    const st = statoOggi(S.ui.data);
    toast(st.fatte >= st.totali ? 'Sessione completa. Stretching 8 min.' : `Chiusa a ${st.fatte} serie su ${st.totali}.`);
    fermaTimer(); lasciaSpegnere(); return;
  }
  if(el('#stampaSess')){ window.print(); return; }

  if(el('#expFile')){ esporta(); return; }
  if(el('#impFile')){ $('#fileIn').click(); return; }
  if(el('#copiaCodice')){
    navigator.clipboard.writeText(JSON.stringify(S))
      .then(() => { S.meta.backup = Date.now(); salva(); toast('Codice copiato negli appunti'); render(); })
      .catch(() => toast('Copia non riuscita: usa “Esporta backup”.'));
    return;
  }
  if(el('#incollaCodice')){
    apriSheet('Incolla il codice', `
      <div class="stack">
        <label class="fld"><span>Codice copiato dall’altro dispositivo</span>
          <textarea id="cin" style="min-height:130px" placeholder='{"v":1,…}'></textarea></label>
        <button class="btn solid wide" id="cok">Unisci ai dati di qui</button>
      </div>`, s => {
      s.querySelector('#cok').onclick = () => {
        try{ const n = fondi(JSON.parse(s.querySelector('#cin').value)); chiudiSheet(); toast(`Uniti ${n} record`); render(); }
        catch(err){ toast('Codice non valido'); }
      };
    });
    return;
  }
  if(el('#reset')){
    apriSheet('Cancellare tutto?', `
      <p class="small">Spariscono ${Object.keys(S.sess).length} sessioni, ${Object.keys(S.pasti).length} giornate di dieta e ${S.corpo.length} pesate, solo su questo dispositivo. Il piano resta.</p>
      <div class="row wrapf" style="margin-top:14px">
        <button class="btn danger" id="rok">Sì, cancella</button>
        <button class="btn ghost" data-chiudi>Annulla</button></div>`, s => {
      s.querySelector('#rok').onclick = () => {
        const tema = S.ui.tema; S = nuovoStato(); S.ui.tema = tema; S.ui.data = oggiISO();
        salva(); chiudiSheet(); toast('Dati cancellati'); render();
      };
    });
    return;
  }
});

  if(t.dataset && t.dataset.i !== undefined && t.dataset.s !== undefined){
    const L = log(S.ui.data), r = (L.set[+t.dataset.i]||[])[+t.dataset.s];
    if(r){ r[t.dataset.k] = t.value; L.mod = Date.now(); salva(); }
    return;
  }
  if(t.id === 'notaSess'){ const L = log(S.ui.data); L.nota = t.value; L.mod = Date.now(); salva(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'selEx'){ S.ui.esercizio = t.value; salva(); renderProgressi(); }
  if(t.id === 'selOra'){ S.ui.oraAll = t.value; salva(); render(); toast('Orari dei pasti aggiornati'); }

                        catch(err){ toast('File non valido'); } };
    fr.readAsText(t.files[0]); t.value = '';
  }
});
/* Invio = passa al campo dopo, senza chiudere la tastiera su iPhone */
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter' || !ev.target.dataset || ev.target.dataset.k === undefined) return;
  ev.preventDefault();
  const campi = $$('#view-workout input[data-k]').filter(x => x.offsetParent !== null);
  const i = campi.indexOf(ev.target);
  if(i >= 0 && campi[i+1]) campi[i+1].focus();
});
/* tooltip dei grafici */
function tip(ev){
  const hit = ev.target.closest('.hit'); const wrap = ev.target.closest('.chartwrap');
  if(!wrap) return;
  const box = wrap.querySelector('.tip'); if(!box) return;
  if(!hit){ box.classList.remove('on'); return; }
  const svg = wrap.querySelector('svg'), r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  box.textContent = hit.dataset.tip;
  box.style.left = (r.left - wrap.getBoundingClientRect().left + (+hit.dataset.x)/vb.width * r.width) + 'px';
  box.style.top  = ((+hit.dataset.y)/vb.height * r.height) + 'px';
  box.classList.add('on');
}
document.addEventListener('pointermove', tip);
document.addEventListener('pointerdown', tip);
document.addEventListener('pointerleave', ev => {
  const w = ev.target.closest && ev.target.closest('.chartwrap');
  if(w) w.querySelector('.tip').classList.remove('on');
}, true);

/* Il titolone della vista, scorrendo, si raccoglie nella barra in alto. */
let osservaTitolo = null;
function agganciaTitolo(){
  if(osservaTitolo) osservaTitolo.disconnect();
  const h1 = $('.view:not([hidden]) h1.big');
  const barra = $('.topbar'), ttl = $('#topttl');
  if(!h1){ barra.classList.remove('raccolta'); return; }
  ttl.textContent = h1.textContent.trim();
  osservaTitolo = new IntersectionObserver(([e]) => {
    barra.classList.toggle('raccolta', !e.isIntersecting);
  }, { rootMargin:'-52px 0px 0px 0px', threshold:0 });
  osservaTitolo.observe(h1);
}
